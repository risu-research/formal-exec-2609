name: Database engine compatibility preflight

on:
  push:
    branches:
      - stage21-db-compat
    paths:
      - .github/workflows/db-compat-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runner resources
        run: |
          set -euo pipefail
          mkdir -p receipts
          {
            echo "UTC: $(date -u +%FT%TZ)"
            uname -a
            nproc
            free -h
            df -h .
            docker version --format '{{.Server.Version}}'
          } > receipts/runner.txt 2>&1
          cat receipts/runner.txt
      - name: Check pinned public benchmark files
        run: |
          set -euo pipefail
          mkdir -p sources receipts
          BASE="https://raw.githubusercontent.com/ClickHouse/ClickBench/1ce27b281d8a73aad75458b0e04a2b77705aac53/versions"
          curl --retry 3 -fsSL "$BASE/prepare-data/ssb.sh" -o sources/ssb.sh
          curl --retry 3 -fsSL "$BASE/queries/ssb.sql" -o sources/ssb.sql
          curl --retry 3 -fsSL "$BASE/create/schema/lineorder_flat.columns" -o sources/lineorder_flat.columns
          test "$(git hash-object sources/ssb.sh)" = "498817696a0ddcd20744a6494610854398db1f03"
          test "$(git hash-object sources/ssb.sql)" = "243bc9feba43359d450e1f9db310338f27fc6175"
          test "$(git hash-object sources/lineorder_flat.columns)" = "0c55a91461af95a8538533984e07afdd0d752c4d"
          git hash-object sources/* > receipts/pinned-source-hashes.txt
          test "$(grep -c '^SELECT ' sources/ssb.sql)" -eq 13
          echo "PINNED_SOURCES_OK" | tee receipts/source-status.txt
      - name: Check low-scale public inputs before downloading
        run: |
          set -euo pipefail
          : > receipts/scale1-inputs.tsv
          for kind in lineorder customer supplier part; do
            url="https://clickhouse-public-datasets.s3.amazonaws.com/ssb/original/1/${kind}.tbl.xz"
            code=$(curl -L -sS --retry 2 --max-time 40 --range 0-63 --output /dev/null --write-out '%{http_code}' "$url" || true)
            echo -e "${kind}\t${code}" | tee -a receipts/scale1-inputs.tsv
            if [ "$code" != 200 ] && [ "$code" != 206 ]; then
              echo "Scale-1 input missing: $kind HTTP $code" >&2
              exit 2
            fi
          done
      - name: Verify exact engine images and local SQL functionality
        run: |
          set -euo pipefail
          : > receipts/engine-versions.tsv
          for ver in 26.7.1.1315 26.8.1.2041; do
            image="clickhouse/clickhouse-server:$ver"
            docker pull "$image"
            docker image inspect --format '{{.Id}}' "$image" >> receipts/image-digests.txt
            out=$(docker run --rm --entrypoint clickhouse "$image" local --query 'SELECT version(), 1 FORMAT TSV')
            printf '%s\t%s\n' "$ver" "$out" | tee -a receipts/engine-versions.tsv
            case "$out" in "$ver"*) ;; *) echo "Unexpected runtime version $out" >&2; exit 3;; esac
          done
          echo "TWO_ENGINE_PREFLIGHT_OK" | tee receipts/result.txt
          df -h . | tee receipts/disk-after.txt
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-compat-preflight
          if-no-files-found: warn
          retention-days: 3
          path: receipts/
