name: sigmetrics-mcp-pilot

on:
  push:
    paths:
      - '.github/workflows/sigmetrics-mcp-pilot.yml'
      - 'sigmetrics_mcp_pilot/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch open conformance corpus and inspect schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fsSL --retry 2 -A 'RISU-SIGMETRICS-Pilot/0.1' \
            https://raw.githubusercontent.com/Neeeophytee/mcp-stateless-conformance/main/servers.json \
            -o out/servers.json
          curl -fsSL --retry 2 -A 'RISU-SIGMETRICS-Pilot/0.1' \
            https://raw.githubusercontent.com/Neeeophytee/mcp-stateless-conformance/main/results.json \
            -o out/results.json
          python3 - <<'PY'
          import json, pathlib
          servers=json.loads(pathlib.Path('out/servers.json').read_text())
          results=json.loads(pathlib.Path('out/results.json').read_text())
          print('SERVERS',len(servers),'SERVER_SAMPLE',json.dumps(servers[0],ensure_ascii=False)[:2000])
          print('RESULTS_TYPE',type(results).__name__,'RESULTS_LEN',len(results))
          if isinstance(results,list):
              for r in results[:3]: print('RESULT_SAMPLE',json.dumps(r,ensure_ascii=False)[:5000])
          elif isinstance(results,dict):
              print('RESULT_KEYS',list(results)[:30])
              for k,v in list(results.items())[:2]: print('RESULT_ITEM',k,json.dumps(v,ensure_ascii=False)[:5000])
          pathlib.Path('out/schema.txt').write_text(
            f'servers={len(servers)}\nserver_sample={json.dumps(servers[0],ensure_ascii=False)}\n'
            f'results_type={type(results).__name__}\nresults_len={len(results)}\n'
          )
          PY
      - name: Upload corpus schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigmetrics-mcp-corpus-schema
          path: out/
