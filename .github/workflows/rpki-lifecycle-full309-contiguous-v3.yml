name: rpki-lifecycle-full309-contiguous-v3
on:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - .github/workflows/rpki-lifecycle-full309-contiguous-v3.yml
      - rpki_lifecycle_full309_contiguous_v3.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Run canonical contiguous lifecycle analysis
        run: python3 rpki_lifecycle_full309_contiguous_v3.py
      - name: Show summary
        run: cat results/rpki_lifecycle_full309_contiguous_v3_20261002/summary.json
      - name: Commit evidence bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpki_lifecycle_full309_contiguous_v3_20261002
          git commit -m "add canonical full-309 contiguous RPKI lifecycle results [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpki-lifecycle-full309-contiguous-v3-20261002
          path: results/rpki_lifecycle_full309_contiguous_v3_20261002
          if-no-files-found: ignore
