name: benchmark-transport-historical

on:
  push:
    branches: [bench-transport-20260929]
    paths:
      - 'bench_transport/**'
      - '.github/workflows/benchmark-transport-historical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==2.2.3 numpy==2.1.3 scipy==1.14.1 tabulate==0.9.0

      - name: Fetch exact historical TabZilla commit
        env:
          UPSTREAM_COMMIT: feca5e554148bdc4ac17c3379984c2a71244cd32
        run: |
          set -euxo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git init upstream
          git -C upstream remote add origin https://github.com/naszilla/tabzilla.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test -f upstream/tabzilla_analysis/final-selected18-algs/cleaned_results/tuned_aggregated_results.csv
          mkdir -p results
          printf 'upstream_commit=%s\n' "$UPSTREAM_COMMIT" > results/PROVENANCE.txt
          git -C upstream rev-parse HEAD >> results/PROVENANCE.txt
          sha256sum upstream/tabzilla_analysis/final-selected18-algs/cleaned_results/tuned_aggregated_results.csv >> results/PROVENANCE.txt

      - name: Execute task-level interaction matrix
        run: |
          set -euxo pipefail
          python bench_transport/run_historical_matrix.py \
            --upstream upstream \
            --out results \
            --bootstrap 5000 \
            --permutations 5000 \
            | tee results/console.txt

      - name: Record environment and checksums
        if: always()
        run: |
          python --version > results/PYTHON_VERSION.txt || true
          python -m pip freeze > results/PIP_FREEZE.txt || true
          (cd results && sha256sum * > SHA256SUMS.txt) || true

      - name: Publish run summary
        if: always()
        run: |
          if [ -f results/SUMMARY.md ]; then cat results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-transport-historical-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 30
