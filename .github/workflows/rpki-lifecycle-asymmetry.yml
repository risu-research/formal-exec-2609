name: rpki-lifecycle-asymmetry
on:
  workflow_dispatch:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - rpki_lifecycle_asymmetry.py
      - .github/workflows/rpki-lifecycle-asymmetry.yml
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Quantify lifecycle asymmetry
        run: python3 rpki_lifecycle_asymmetry.py
      - name: Commit asymmetry evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpki_lifecycle_asymmetry_20261002
          git commit -m "add RPKI lifecycle asymmetry analysis [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        with:
          name: rpki-lifecycle-asymmetry-20261002
          path: results/rpki_lifecycle_asymmetry_20261002
