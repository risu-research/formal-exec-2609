name: rpki-lifecycle-full309-v1
on:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - .github/workflows/rpki-lifecycle-full309-v1.yml
      - rpki_lifecycle_full309_v1.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lifecycle309:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Run full outcome-blind exact lifecycle extension
        run: python3 rpki_lifecycle_full309_v1.py
      - name: Show closeout summary
        run: cat results/rpki_lifecycle_full309_v1_20261002/summary.json
      - name: Commit evidence bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/rpki_lifecycle_full309_v1_20261002
          git commit -m "add full 309-case RPKI lifecycle results [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        with:
          name: rpki-lifecycle-full309-v1-20261002
          path: results/rpki_lifecycle_full309_v1_20261002
