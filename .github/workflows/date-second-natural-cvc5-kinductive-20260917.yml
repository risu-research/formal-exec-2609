name: date-second-natural-cvc5-kinductive-20260917
on:
  push:
    branches: [research/date-second-natural-20260917]
    paths: [.github/workflows/date-second-natural-cvc5-kinductive-20260917.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cvc5-k-induction:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: old
            sha: 2270d473bed97748f444537dc05a39eb6bcc0f6a
          - name: new
            sha: e13a7f30d6dce7579dd90285ceb9327a0ed80bbc
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source-pinned independent solver proof
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y yosys cvc5 git make python3-click
          git clone -q --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby-independent-kind
          sudo make -s -C /tmp/sby-independent-kind install
          mkdir -p cert
          (cvc5 --version; yosys -V; sby --version; git rev-parse HEAD) > cert/tools.txt 2>&1
          git clone -q --filter=blob:none https://github.com/ZipCPU/wbuart32.git /tmp/u-kind
          git -C /tmp/u-kind checkout -q --detach '${{ matrix.sha }}'
          test "$(git -C /tmp/u-kind rev-parse HEAD)" = '${{ matrix.sha }}'
          cd /tmp/u-kind/bench/formal
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('txuartlite.sby');s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='0f6e4052acbae61bf84dd2d9de304ea24ca2afd43f6fba6c87474082a4860e5f'
          assert s.count('smtbmc boolector')==s.count('depth 90')==1
          target=s.replace('smtbmc boolector','smtbmc cvc5').replace('depth 90','depth 12')
          assert target!=s and 'depth 12' in target
          Path('txuartlite_cvc5_kind.sby').write_text(target)
          PY
          sha256sum txuartlite.sby txuartlite_cvc5_kind.sby ../../rtl/txuartlite.v > "$GITHUB_WORKSPACE/cert/sources.sha256"
      - name: Prove both base case and temporal induction using cvc5
        shell: bash
        run: |
          set -uo pipefail
          cd /tmp/u-kind/bench/formal
          if timeout --signal=TERM --kill-after=10s 720s sby -f txuartlite_cvc5_kind.sby prf > "$GITHUB_WORKSPACE/cert/replay.log" 2>&1; then rc=0; else rc=$?; fi
          echo "$rc" > "$GITHUB_WORKSPACE/cert/exit_code"
          if test "$rc" -eq 0 && test -f txuartlite_cvc5_kind_prf/PASS && grep -q 'successful proof by k-induction' "$GITHUB_WORKSPACE/cert/replay.log" && grep -q 'DONE (PASS, rc=0)' "$GITHUB_WORKSPACE/cert/replay.log"; then
            echo 'INDEPENDENT_CVC5_UNBOUNDED_K_INDUCTION_PASS_DEPTH12' > "$GITHUB_WORKSPACE/cert/verdict"
          else
            echo 'INDEPENDENT_CVC5_K_INDUCTION_NOT_CERTIFIED' > "$GITHUB_WORKSPACE/cert/verdict"
          fi
          if test -f txuartlite_cvc5_kind_prf/logfile.txt; then cp txuartlite_cvc5_kind_prf/logfile.txt "$GITHUB_WORKSPACE/cert/sby.log"; fi
          tail -18 "$GITHUB_WORKSPACE/cert/replay.log"
      - name: Freeze audit artifacts, successful or not
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd cert
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: date-second-natural-cvc5-kind-${{ matrix.name }}
          path: cert/
          if-no-files-found: error
          retention-days: 90
      - name: Fail closed if independent proof unresolved
        run: test "$(cat cert/verdict)" = 'INDEPENDENT_CVC5_UNBOUNDED_K_INDUCTION_PASS_DEPTH12'
