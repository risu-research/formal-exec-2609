name: rpki-ripe-archive-crosscheck
on:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - 'runs/TRIGGER_RPKI_RIPE_ARCHIVE_CROSSCHECK*.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently reconstruct 16 inversion cases from RIPE daily VRPs
        run: python rpki_ripe_archive_crosscheck.py
      - name: Commit independent results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/rpki_ripe_archive_crosscheck_20261002
          git diff --cached --quiet || git commit -m 'add independent RIPE VRP cross-check [skip ci]'
          git pull --rebase origin rpki-pilot-20261002
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        with:
          name: rpki-ripe-archive-crosscheck-20261002
          path: results/rpki_ripe_archive_crosscheck_20261002
          retention-days: 90
