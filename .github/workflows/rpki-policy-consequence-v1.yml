name: rpki-policy-consequence-v1
on:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - 'runs/TRIGGER_RPKI_POLICY_CONSEQUENCE_V1*.txt'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover corrected exact-date lifecycle artifact
        uses: actions/download-artifact@v4
        with:
          name: rpki-exact-date-delta-v2-20261002
          path: recovered
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37059101942
      - name: Install corrected lifecycle input
        run: |
          mkdir -p results/rpki_lifecycle_refine_v2_20261002
          cp recovered/rpki_lifecycle_refine_v2_20261002/exact_lifecycle_v2.csv results/rpki_lifecycle_refine_v2_20261002/exact_lifecycle_v2.csv
          wc -l results/rpki_lifecycle_refine_v2_20261002/exact_lifecycle_v2.csv
      - name: Run historical ROV consequence replay
        run: python rpki_policy_consequence_v1.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/rpki_policy_consequence_v1_20261002
          git diff --cached --quiet || git commit -m 'add corrected RPKI policy consequence replay [skip ci]'
          git pull --rebase origin rpki-pilot-20261002
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        with:
          name: rpki-policy-consequence-v1-corrected-20261002
          path: results/rpki_policy_consequence_v1_20261002
          retention-days: 90
