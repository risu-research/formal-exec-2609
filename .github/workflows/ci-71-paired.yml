name: ci-71-paired-compaction
on:
  push:
    branches: [ci71-paired-compaction]
    paths: [experiments/db_c71_paired.py, .github/workflows/ci-71-paired.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  paired-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        group: [a, b, c]
    env:
      C69_RESTART: "0"
      C68_RESTART: "0"
      C68_REPS: "4"
      RUN_GROUP: ${{ matrix.group }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check source and hashes
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/db_c71_paired.py experiments/db_c69_mixed_age.py experiments/db_c68_http_client.py experiments/db_c42.py experiments/db_mixed_history_upgrade.py
          sha256sum experiments/db_c71_paired.py experiments/db_c69_mixed_age.py experiments/db_c68_http_client.py > SOURCE_SHA256.txt
      - name: Run before and after paired compaction
        run: |
          set -o pipefail
          python3 experiments/db_c71_paired.py 2>&1 | tee progress.log
      - name: Archive all C71 evidence including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c71-${{ matrix.group }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            SOURCE_SHA256.txt
            progress.log
            c71paired/PRESPECIFICATION.json
            c71paired/SOURCE_IDENTITY.json
            c71paired/month_plan.json
            c71paired/decision_matrix.csv
            c71paired/FINAL_STATUS.json
            c71paired/PAIR_MATRIX.csv
            c71paired/C71_FINAL_STATUS.json
            c71paired/before_version_restart/
            c71paired/old_sham_before/
            c71paired/old_sham/
            c71paired/old_sham_after/
            c71paired/target_before_rebuild/
            c71paired/target_before_measure/
            c71paired/target/
            c71paired/target_after_measure/
            c71paired/before_compaction/
            c71paired/after_compaction_before_measure/
            c71paired/compacted/
            c71paired/after_compaction_after_measure/
