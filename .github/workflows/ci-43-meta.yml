name: ci-43-meta
on:
  push:
    branches: [stage39-independent-replication]
    paths: [.github/workflows/ci-43-meta.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: |
          python3 -m py_compile experiments/db_c43_metadata.py
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
          uname -a
          lscpu | grep -E '(Model name|CPU\(s\))' || true
          sha256sum experiments/db_c43_metadata.py
      - name: Run controlled changes
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_c43_metadata.py 2>&1 | tee c43m.log
      - name: Retain original receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c43-meta-receipts
          retention-days: 14
          if-no-files-found: warn
          path: |
            c43m.log
            c43m/SOURCE_IDENTITY.json
            c43m/FINAL_STATUS.json
            c43m/initial/physical.json
            c43m/initial_after/physical.json
            c43m/built/physical.json
            c43m/built_after/physical.json
            c43m/cleared/physical.json
            c43m/cleared_after/physical.json
            c43m/rebuilt/physical.json
            c43m/rebuilt_after/physical.json
            c43m/initial/receipts.csv
            c43m/initial/means.json
            c43m/built/receipts.csv
            c43m/built/means.json
            c43m/cleared/receipts.csv
            c43m/cleared/means.json
            c43m/rebuilt/receipts.csv
            c43m/rebuilt/means.json

# batched verification implementation
