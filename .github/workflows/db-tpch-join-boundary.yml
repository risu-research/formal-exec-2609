name: Independent TPC-H stat value boundary
on:
  push:
    branches: [stage21-db-compat]
    paths: [experiments/db_tpch_join_boundary.py, .github/workflows/db-tpch-join-boundary.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  tpch:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner disk
        run: |
          df -h .
          free -h
      - name: Run official TPC-H query subset with factorial statistics
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_tpch_join_boundary.py 2>&1 | tee stage26-run.log
      - name: Preserve provenance and query-level receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage26-tpch-independent-boundary
          retention-days: 10
          if-no-files-found: warn
          path: |
            stage26-run.log
            s26/*.json
            s26/*.csv
            s26/*.sql
            s26/26.7.1.1315/*
            s26/26.8.1.2041/*
