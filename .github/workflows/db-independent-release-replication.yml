name: Stage34 independent release pair 26.6 to 26.7
on:
  push:
    branches: [stage27-part-count]
    paths:
      - experiments/db_independent_release_replication.py
      - .github/workflows/db-independent-release-replication.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  release_pair_replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: |
          python3 -m py_compile experiments/db_independent_release_replication.py
          df -h .
          free -h
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
      - name: Full original gate on 26.6 and 26.7
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_independent_release_replication.py 2>&1 | tee stage34.log
      - name: Always preserve query receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-release-replication-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            stage34.log
            s34/SOURCE_IDENTITY.json
            s34/FINAL_STATUS.json
            s34/stage25_gate_matrix.csv
            s34/per_query_ratios.csv
            s34/all_medians.csv
            s34/old_fresh/
            s34/old_reattached/
            s34/new_inherited/
            s34/new_fresh/
            s34/new_reattached/
