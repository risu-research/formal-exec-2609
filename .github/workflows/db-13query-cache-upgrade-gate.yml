name: Stage32 13-query cache-matched SSB upgrade gates
on:
  push:
    branches: [stage27-part-count]
    paths:
      - experiments/db_13query_cache_upgrade_gate.py
      - .github/workflows/db-13query-cache-upgrade-gate.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  complete_factorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and runner
        run: |
          python3 -m py_compile experiments/db_13query_cache_upgrade_gate.py
          df -h .
          free -h
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
      - name: 26.7 to 26.8 state matched and cache matched factorial
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_13query_cache_upgrade_gate.py 2>&1 | tee stage32.log
      - name: Archive all original data and query receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage32-complete-13query-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            stage32.log
            s32/SOURCE_IDENTITY.json
            s32/FINAL_STATUS.json
            s32/stage25_gate_matrix.csv
            s32/per_query_ratios.csv
            s32/all_medians.csv
            s32/old_settings.tsv
            s32/new_settings.tsv
            s32/old_fresh/
            s32/old_reattached/
            s32/new_inherited/
            s32/new_fresh/
            s32/new_reattached/
