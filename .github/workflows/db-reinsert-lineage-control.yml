name: Stage30b inherited versus fresh 26.8 statistics
on:
  push:
    branches: [stage27-part-count]
    paths: [experiments/db_reinsert_lineage_control.py, .github/workflows/db-reinsert-lineage-control.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  matched_lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: |
          python3 -m py_compile experiments/db_reinsert_lineage_control.py
          df -h .
          free -h
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
      - name: Same 26.8 server inherited versus newly materialized statistics
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_reinsert_lineage_control.py 2>&1 | tee stage30b-run.log
      - name: Preserve comparison and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage30b-lineage-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            stage30b-run.log
            s30b/SOURCE_IDENTITY.json
            s30b/FINAL_STATUS.json
            s30b/before/
            s30b/after/
            s30b/answers_sha256.json
            s30b/plans/
            s30b/receipts.csv
            s30b/medians.csv
            s30b/query_log.jsonl
