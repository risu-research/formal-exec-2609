name: verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install formal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys make git
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          sudo make -C /tmp/sby install PREFIX=/usr/local
          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver
          yosys -V
          sby --version || true
          python3 - <<'PY'
          import z3
          print(z3.get_version_string())
          PY
      - name: Elaborate formal fixture
        run: |
          mkdir -p out
          yosys -p 'read_verilog -formal smoke/design.v; prep -top top; write_json out/design.json'
      - name: Validate formal-cell inventory
        run: python3 smoke/check_json.py out/design.json
      - name: Resolve SBY task semantics
        run: |
          sby --dumptasks smoke/check.sby > out/tasks.txt
          sby --dumpdefaults smoke/check.sby > out/defaults.txt
          sby --dumptaskinfo smoke/check.sby > out/taskinfo.json
          sby --dumpcfg smoke/check.sby > out/config.txt
          test -s out/taskinfo.json
          cat out/tasks.txt
          cat out/defaults.txt
          python3 -m json.tool out/taskinfo.json >/dev/null
      - name: Generic SMT sanity
        run: |
          python3 - <<'PY'
          import z3
          x, y = z3.Bools('x y')
          s = z3.Solver()
          s.add(x, z3.Not(y))
          assert s.check() == z3.sat
          m = s.model()
          assert z3.is_true(m.eval(x, model_completion=True))
          assert z3.is_false(m.eval(y, model_completion=True))
          print('SMT_OK')
          PY
