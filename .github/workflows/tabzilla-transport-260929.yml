name: tabzilla-transport-260929

on:
  push:
    branches:
      - run/tabzilla-transport-260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public execution shell
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy tabulate

      - name: Fetch exact historical TabZilla source
        shell: bash
        run: |
          set -euo pipefail
          git init tabzilla-src
          git -C tabzilla-src remote add origin https://github.com/naszilla/tabzilla.git
          git -C tabzilla-src fetch --depth=1 origin feca5e554148bdc4ac17c3379984c2a71244cd32
          git -C tabzilla-src checkout --detach FETCH_HEAD
          test "$(git -C tabzilla-src rev-parse HEAD)" = "feca5e554148bdc4ac17c3379984c2a71244cd32"
          CSV='tabzilla_analysis/final-selected18-algs/cleaned_results/tuned_aggregated_results.csv'
          test -f "tabzilla-src/$CSV"
          BLOB=$(git -C tabzilla-src hash-object "$CSV")
          echo "historical_csv_blob=$BLOB" | tee source_identity.txt
          test "$BLOB" = "6afbc26593d51fad95927729305ab3b98ab0e56a"
          sha256sum "tabzilla-src/$CSV" | tee source_sha256.txt
          wc -l "tabzilla-src/$CSV" | tee source_linecount.txt

      - name: Compute full task-level interaction matrix
        shell: bash
        run: |
          set -euo pipefail
          CSV='tabzilla-src/tabzilla_analysis/final-selected18-algs/cleaned_results/tuned_aggregated_results.csv'
          python runs/tabzilla-transport-260929/analyze.py \
            --csv "$CSV" \
            --out results/tabzilla-transport-260929 \
            --boot 5000 \
            --perm 10000
          cp source_identity.txt source_sha256.txt source_linecount.txt results/tabzilla-transport-260929/
          find results/tabzilla-transport-260929 -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > results/tabzilla-transport-260929/SHA256SUMS.txt
          cat results/tabzilla-transport-260929/summary.json
          sed -n '1,120p' results/tabzilla-transport-260929/REPORT.md

      - name: Upload frozen audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabzilla-transport-260929
          path: results/tabzilla-transport-260929/
          if-no-files-found: error
          retention-days: 30
