name: ci-58
on:
  push:
    branches: [ci58-neutral-run]
    paths: [.github/workflows/ci-58.yml, experiments/db_c58.py]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  paired-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        run_group: [a, b]
    env:
      RUN_GROUP: ${{ matrix.run_group }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate experiment source
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/db_c42.py experiments/db_c58.py
          if grep -iE '(moon.?hwan|northwestern|@hotmail|@risuinstitute|sigmod|risu institute|patent bar|submission)' experiments/db_c58.py; then exit 1; fi
          sha256sum experiments/db_c42.py experiments/db_c58.py > SOURCE_SHA256.txt
      - name: Run release-state comparison
        run: |
          set -o pipefail
          python3 experiments/db_c58.py 2>&1 | tee progress.log
      - name: Package raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci58-${{ matrix.run_group }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            SOURCE_SHA256.txt
            progress.log
            c58/
