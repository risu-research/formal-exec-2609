name: ci-63
on:
  push:
    branches: [ci63-external-workload]
    paths: [experiments/db_c63_tpch.py, .github/workflows/ci-63.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  independent-workload:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        run_group: [a, b]
    env:
      RUN_GROUP: ${{ matrix.run_group }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed generator and verify source
        run: |
          python3 -m pip install --disable-pip-version-check --quiet duckdb==1.4.1
          python3 -m py_compile experiments/db_c63_tpch.py
          sha256sum experiments/db_c63_tpch.py > SOURCE_SHA256.txt
      - name: Execute held-out TPC-H population
        run: |
          set -o pipefail
          python3 experiments/db_c63_tpch.py 2>&1 | tee progress.log
      - name: Save audit materials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci63-${{ matrix.run_group }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            SOURCE_SHA256.txt
            progress.log
            c63/PREREGISTRATION.json
            c63/SOURCE_MANIFEST.json
            c63/DATASET_COUNTS.json
            c63/ELIGIBILITY.json
            c63/old_state.json
            c63/new_states.json
            c63/DECISIONS.json
            c63/FINAL_STATUS.json
            c63/baseline_receipts.csv
            c63/target_receipts.csv
            c63/baseline_log.jsonl
            c63/target_log.jsonl
            c63/tp_old/answer_hashes.json
            c63/tp_new/answer_hashes.json
            c63/pinned/queries/tpch.sql
