name: ci-44b
on:
  push:
    branches: [stage39-independent-replication]
    paths: [.github/workflows/ci-44b.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  normalized:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Record environment
        run: |
          set -euo pipefail
          mkdir -p c44b
          uname -a > c44b/host.txt
          lscpu | grep -E '(Model name|CPU\(s\))' >> c44b/host.txt || true
          free -h >> c44b/host.txt
          df -h . >> c44b/host.txt
          sha256sum experiments/db_c44_b.py experiments/db_tpch_join_boundary.py >> c44b/host.txt
          python3 -m py_compile experiments/db_c44_b.py
      - name: Run normalized query comparison
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_c44_b.py 2>&1 | tee c44b/trace.log
      - name: Preserve measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c44b-raw
          if-no-files-found: warn
          retention-days: 14
          path: |
            c44b/
            c44b/FINAL_STATUS.json
            c44b/settings.tsv
            c44b/ingest.json
            c44b/fixed/physical.json
            c44b/verified/physical.json
            c44b/answers.json
            c44b/plans.json
            c44b/receipts.csv
            c44b/medians.json
            c44b/upstream_tpch_*.sql
            c44b/upstream_schema.sql
