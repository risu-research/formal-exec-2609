name: control

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutant:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git make python3
          yosys -V
          z3 --version
      - name: Checkout upstream base
        run: |
          git clone https://github.com/ZipCPU/zipcpu.git /tmp/upstream
          cd /tmp/upstream
          git checkout d511239e19be8fcc7f340a64554ea93699637e62
      - name: Apply controlled formal mutation and probe
        run: |
          cd /tmp/upstream
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rtl/core/pipemem.v')
          s=p.read_text()
          old="""//always @(posedge i_clk)\n//\tif ((f_past_valid)&&($past(f_cyc))&&(!$past(i_lock)))\n//\t\t`ASSUME(!i_lock);\n"""
          new="""always @(posedge i_clk)\n\tif ((f_past_valid)&&($past(f_cyc))&&(!$past(i_lock)))\n\t\t`ASSUME(!i_lock);\n"""
          probe="""\n`ifdef FORMAL\nalways @(posedge i_clk)\n\tif ((f_past_valid)&&($past(f_cyc))&&(!$past(i_lock))&&(i_lock))\n\t\tcover(1'b1);\n`endif\n"""
          if old not in s:
              raise SystemExit('mutation anchor not found')
          p.write_text(s.replace(old,new+probe,1))
          PY
          sed -i '/write_smt2/i dffunmap' bench/formal/pipemem.ys
          printf 'base=d511239e19be8fcc7f340a64554ea93699637e62\nmutation=reactivate-historical-i_lock-assumption\n' > "$GITHUB_WORKSPACE/mutant.meta"
      - name: Mutant full formal target
        run: |
          cd /tmp/upstream
          make -C bench/formal clean >/dev/null 2>&1 || true
          set -o pipefail
          make -C bench/formal pipemem SOLVER='-s z3' 2>&1 | tee "$GITHUB_WORKSPACE/mutant_proof.log"
      - name: Mutant exclusion check
        run: |
          cd /tmp/upstream/bench/formal
          set +e
          yosys-smtbmc --presat -s z3 -c -t 40 --dump-vcd "$GITHUB_WORKSPACE/mutant_delta.vcd" pipemem.smt2 2>&1 | tee "$GITHUB_WORKSPACE/mutant_delta.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$GITHUB_WORKSPACE/mutant_delta.exit"
          grep -q 'Unreached cover statement' "$GITHUB_WORKSPACE/mutant_delta.log"
          test "$rc" -ne 0
      - name: Upload controlled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-formal-mutation
          path: |
            mutant.meta
            mutant_proof.log
            mutant_delta.log
            mutant_delta.exit
