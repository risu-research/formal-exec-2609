name: tabzilla-transport-raw18-260929
on:
  push:
    branches: [run/tabzilla-transport-260929]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas scipy
      - name: Fetch exact source and verify raw aggregate
        shell: bash
        run: |
          set -euo pipefail
          git init tabzilla-src
          git -C tabzilla-src remote add origin https://github.com/naszilla/tabzilla.git
          git -C tabzilla-src fetch --depth=1 origin feca5e554148bdc4ac17c3379984c2a71244cd32
          git -C tabzilla-src checkout --detach FETCH_HEAD
          test "$(git -C tabzilla-src rev-parse HEAD)" = feca5e554148bdc4ac17c3379984c2a71244cd32
          CSV=tabzilla_analysis/results/tuned_aggregated_results.csv
          test -f "tabzilla-src/$CSV"
          BLOB=$(git -C tabzilla-src hash-object "$CSV")
          echo "raw_blob=$BLOB" | tee source_identity.txt
          test "$BLOB" = 63a9add515a5574a5f529757b071f3ee2d11d9da
          sha256sum "tabzilla-src/$CSV" | tee source_sha256.txt
          wc -l "tabzilla-src/$CSV" | tee source_linecount.txt
      - name: Run broad pairwise-common-task audit
        shell: bash
        run: |
          set -euo pipefail
          CSV=tabzilla-src/tabzilla_analysis/results/tuned_aggregated_results.csv
          python runs/tabzilla-transport-260929/analyze_raw18.py --csv "$CSV" --out results/tabzilla-raw18-260929 --boot 5000 --perm 10000
          cp source_*.txt results/tabzilla-raw18-260929/
          find results/tabzilla-raw18-260929 -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > results/tabzilla-raw18-260929/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tabzilla-raw18-260929
          path: results/tabzilla-raw18-260929/
          retention-days: 30
