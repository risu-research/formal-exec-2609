name: rpki-event-definition-sensitivity-v1
on:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - 'rpki_event_definition_sensitivity_v1.py'
      - '.github/workflows/rpki-event-definition-sensitivity-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Run sensitivity audit
        run: python3 rpki_event_definition_sensitivity_v1.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpki_event_definition_sensitivity_v1_20261002
          git commit -m "add event-definition sensitivity results [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        with:
          name: rpki-event-definition-sensitivity-v1-20261002
          path: results/rpki_event_definition_sensitivity_v1_20261002
          if-no-files-found: error
