name: Stage39 Independent Stage37-38 Replication
on:
  push:
    branches: [stage39-independent-replication]
    paths:
      - .github/workflows/db-stage39-independent-replication.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replicate_stage37:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record host and exact immutable source
        run: |
          mkdir -p stage39
          {
            echo "experiment=stage37_replicate"
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_NAME"
            date -u '+utc=%FT%TZ'
            uname -a
            grep -m1 'model name' /proc/cpuinfo || true
            nproc
            free -h
            df -h .
            sha256sum experiments/db_mixed_history_upgrade.py
          } | tee stage39/host_stage37.txt
      - name: Prepare and run unmodified Stage37
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/db_mixed_history_upgrade.py
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
          PYTHONUNBUFFERED=1 python3 experiments/db_mixed_history_upgrade.py 2>&1 | tee stage39/stage37_replica.log
      - name: Preserve raw results on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage39-stage37-independent-replica
          retention-days: 14
          if-no-files-found: warn
          path: |
            stage39/host_stage37.txt
            stage39/stage37_replica.log
            s37/
  replicate_stage38:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Record host and exact immutable source
        run: |
          mkdir -p stage39
          {
            echo "experiment=stage38_replicate"
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_NAME"
            date -u '+utc=%FT%TZ'
            uname -a
            grep -m1 'model name' /proc/cpuinfo || true
            nproc
            free -h
            df -h .
            sha256sum experiments/db_natural_merge_decision_lifetime.py
          } | tee stage39/host_stage38.txt
      - name: Prepare and run unmodified Stage38
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/db_natural_merge_decision_lifetime.py
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
          PYTHONUNBUFFERED=1 python3 experiments/db_natural_merge_decision_lifetime.py 2>&1 | tee stage39/stage38_replica.log
      - name: Preserve raw results on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage39-stage38-independent-replica
          retention-days: 14
          if-no-files-found: warn
          path: |
            stage39/host_stage38.txt
            stage39/stage38_replica.log
            s38/
