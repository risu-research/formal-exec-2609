name: rpki-event-definition-sensitivity-finalize-v2
on:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - 'rpki_event_definition_sensitivity_finalize_v2.py'
      - '.github/workflows/rpki-event-definition-sensitivity-finalize-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Finalize against canonical v2
        run: python3 rpki_event_definition_sensitivity_finalize_v2.py
      - name: Commit final sensitivity outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpki_event_definition_sensitivity_v1_20261002/canonical_v2_*.json results/rpki_event_definition_sensitivity_v1_20261002/canonical_v2_windows.csv
          git commit -m "add canonical v2 event sensitivity closeout [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
# trigger: canonical-v2-closeout
