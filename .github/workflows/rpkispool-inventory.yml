name: rpkispool-inventory
on:
  workflow_dispatch:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - rpkispool_inventory.py
      - .github/workflows/rpkispool-inventory.yml
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Inventory RPKISPOOL mirrors
        run: python3 rpkispool_inventory.py
      - name: Commit inventory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpkispool_inventory_20261002
          git commit -m "add RPKISPOOL high-frequency inventory [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        with:
          name: rpkispool-inventory-20261002
          path: results/rpkispool_inventory_20261002
