name: date-g2-bill-human-witness-dual-20260917
on:
  push:
    branches: [research/date-g2-independent-20260917]
    paths: [.github/workflows/date-g2-bill-human-witness-dual-20260917.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Obtain sealed actual IR QF_BV, install both solvers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y z3 cvc5 python3
          mkdir -p evidence input
          gh run download 35292888310 --repo risu-research/formal-exec-2609 -n date-g2-bill-real-ir-dual-solver-v3 -D input
          (cd input && sed 's@  evidence/@  @' SHA256SUMS.txt | sha256sum --check --status)
          cp input/meta.json evidence/original_meta.json
          { z3 --version; cvc5 --version | head -1; } > evidence/tool_versions.txt
      - name: Fix an explicit source-evaluated symbolic witness and cross-check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess
          p=pathlib.Path('input');out=pathlib.Path('evidence');original=(p/'loss.smt2').read_text()
          meta=json.loads((p/'meta.json').read_text())
          assert hashlib.sha256(original.encode()).hexdigest()==meta['query_sha256']['loss']
          assert original.count('(check-sat)')==1
          assert '(get-value (' in original
          source=original[:original.index('(get-value (')]
          witness={'wptr':9,'rptr':0,'commit_ptr':0,'f_init':0,'f_past_valid':0}
          restrictions=['(assert (= |K_input_rst_n_0| #b1))']
          for k,v in witness.items():
            for i in range(4 if k in ('wptr','rptr','commit_ptr') else 1):
              sym=f'|K_state_{k}_{i}|'
              assert f'(declare-fun {sym} () (_ BitVec 1))' in source
              restrictions.append(f'(assert (= {sym} #b{(v>>i)&1}))')
          source=source.replace('(check-sat)','\n'.join(restrictions)+'\n(check-sat)')
          dest=out/'fixed_witness_loss.smt2';dest.write_text(source)
          result={'fixed_witness':witness,'rst_n':1,'scope':'unreachable-from-reset symbolic sampled-clock witness; NOT physical hardware counterexample','source_loss_sha256':meta['query_sha256']['loss'],'fixed_query_sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'solvers':{}}
          for label,cmd in [('z3',['z3','-smt2',str(dest)]),('cvc5',['cvc5','--lang','smt2','--produce-models',str(dest)])]:
            r=subprocess.run(cmd,text=True,capture_output=True,timeout=60)
            (out/(label+'.stdout')).write_text(r.stdout)
            (out/(label+'.stderr')).write_text(r.stderr)
            verdict=r.stdout.strip().splitlines()[0] if r.stdout.strip() else 'EMPTY'
            assert r.returncode==0 and verdict=='sat' and '(error' not in r.stdout+r.stderr,(label,r.returncode,r.stdout[:250],r.stderr[:250])
            result['solvers'][label]='sat';print(label,'FIXED_ORIGINAL_IR_LOSS_WITNESS_SAT')
          (out/'fixed_witness_cert.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          PY
      - name: Seal success or failure
        if: always()
        run: |
          mkdir -p evidence
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: date-g2-bill-human-witness-dual
          path: evidence/
          if-no-files-found: error
          retention-days: 90
