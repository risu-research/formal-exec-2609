name: ci-68-http-completion
on:
  push:
    branches: [ci68-http-client-completion]
    paths: [experiments/db_c68_http_client.py, .github/workflows/ci-68-http-completion.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  http-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        restart: [0, 1]
        group: [a, b]
    env:
      C68_RESTART: ${{ matrix.restart }}
      C68_REPS: "6"
      RUN_GROUP: ${{ matrix.group }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/db_c68_http_client.py experiments/db_c42.py experiments/db_sf1_probe.py
          sha256sum experiments/db_c68_http_client.py experiments/db_c42.py experiments/db_sf1_probe.py > SOURCE_SHA256.txt
      - name: Run HTTP client response measurements
        run: |
          set -o pipefail
          python3 experiments/db_c68_http_client.py 2>&1 | tee progress.log
      - name: Archive controls and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c68-r${{ matrix.restart }}-${{ matrix.group }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            SOURCE_SHA256.txt
            progress.log
            c68/PRESPECIFICATION.json
            c68/CLIENT_COMPARISONS.json
            c68/FINAL_STATUS.json
            c68/SOURCE_IDENTITY.json
            c68/calendar.json
            c68/old_initial/
            c68/old_initial_after_measure/
            c68/old_sham/
            c68/old_sham_before/
            c68/old_sham_after/
            c68/target_before_rebuild/
            c68/target_before_measure/
            c68/target/
            c68/target_after_measure/
            c68/identity/
            c68/official/queries/ssb.sql
