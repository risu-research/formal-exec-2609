name: rpki-outcomeblind-exact-v1
on:
  workflow_dispatch:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - rpki_outcomeblind_exact_v1.py
      - .github/workflows/rpki-outcomeblind-exact-v1.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Run full outcome-blind exact validation
        run: python3 rpki_outcomeblind_exact_v1.py
      - name: Commit evidence if present
        run: |
          if [ ! -f results/rpki_outcomeblind_exact_v1_20261002/summary.json ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpki_outcomeblind_exact_v1_20261002
          git commit -m "add outcome-blind exact validation evidence [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpki-outcomeblind-exact-v1-20261002
          path: results/rpki_outcomeblind_exact_v1_20261002
          if-no-files-found: ignore
