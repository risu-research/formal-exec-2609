name: ci-55
on:
  push:
    branches: [ci48-neutral-run]
    paths: [.github/workflows/ci-55.yml, experiments/db_c55.py]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  balanced-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Verify code and factorial counterbalance
        run: |
          set -euo pipefail
          mkdir -p audit55
          sha256sum experiments/db_c42.py experiments/db_c50.py experiments/db_c52.py experiments/db_c53.py experiments/db_c54.py experiments/db_c55.py > audit55/SOURCE_SHA256.txt
          python3 -m py_compile experiments/db_c55.py
          if grep -iE '(moon.?hwan|northwestern|@hotmail|@risuinstitute|password=|bearer [a-z0-9_-]+)' experiments/db_c55.py; then exit 1; fi
          python3 experiments/db_c55.py --preflight
      - name: Perform frozen physical state and balanced prime crossover
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_c55.py 2>&1 | tee audit55/progress.log
      - name: Preserve replication evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c55-balanced-startup-crossover
          retention-days: 14
          if-no-files-found: warn
          path: |
            audit55/
            s55/PREREGISTERED.json
            s55/SOURCE_IDENTITY.json
            s55/calendar.json
            s55/FINAL_STATUS.json
            s55/post_ingest/state.json
            s55/post_ingest/physical_baseline.json
            s55/post_ingest/order_schedule.json
            s55/post_ingest/profile_summary.json
            s55/post_ingest/decisions.json
            s55/post_ingest/startup_policy_contrasts.json
            s55/post_ingest/validation.json
            s55/post_ingest/receipts.csv
            s55/later/state.json
            s55/later/physical_baseline.json
            s55/later/order_schedule.json
            s55/later/profile_summary.json
            s55/later/decisions.json
            s55/later/startup_policy_contrasts.json
            s55/later/validation.json
            s55/later/receipts.csv
            s55/post_ingest/reset_changed_*.json
            s55/later/reset_changed_*.json
