name: rpki-panel-policy-audit
on:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - 'runs/TRIGGER_RPKI_PANEL_POLICY_AUDIT*.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python rpki_panel_policy_audit.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/rpki_panel_policy_audit_20261002
          git diff --cached --quiet || git commit -m 'add clean-panel RPKI policy inversion audit [skip ci]'
          git pull --rebase origin rpki-pilot-20261002
          git push origin HEAD:rpki-pilot-20261002
