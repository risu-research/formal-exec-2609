name: j-custody913-heldout-isolated-access
on:
  push:
    branches: [exec/j-custody913]
    paths: [.github/workflows/j-custody913-heldout.yml]
permissions:
  contents: read
jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enforce frozen development implementation
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/custody/trusted_broker.py)" = "7c47d692e99d8d79c9557c8e2d11409b685a78a5"
          test "$(git hash-object experiments/custody/agent_worker.py)" = "95e0a3f45aee6b149f5bd79723f3a0c50a94fdf8"
          test "$(git hash-object experiments/custody/integrated_driver.py)" = "0291f3fc37c233af547668e424256a477ff7763c"
          test "$(git hash-object experiments/custody/independent_auditor.py)" = "2a33aa996bae26026216b184fb43278ea4a65883"
          python3 -m py_compile experiments/custody/*.py
          python3 experiments/custody/integrated_driver.py --partition plan | tee protocol.log
          git rev-parse HEAD > evaluation_commit.txt
          sha256sum experiments/custody/*.py > source_hashes.txt
      - name: Independently seeded Linux source custody and replay evaluation
        run: |
          set -euo pipefail
          docker run --rm --network host -v "$PWD:/work" -w /work ghcr.io/astral-sh/uv:python3.12-bookworm-slim \
            sh -c 'set -eu; uv venv /tmp/shared-langgraph --python python3.12; uv pip install --python /tmp/shared-langgraph/bin/python "langgraph==1.2.12"; chmod -R a+rX /tmp/shared-langgraph; /tmp/shared-langgraph/bin/python experiments/custody/integrated_driver.py --partition holdout --out /work/_custody_holdout || { for d in /tmp/rv-custody-*/; do cat "$d/agent.stderr" "$d/broker.log" 2>/dev/null || true; done; exit 1; }' | tee heldout_execution.log
      - name: Read-only SQL audit and controlled database tamper negative
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" _custody_holdout
          python3 experiments/custody/independent_auditor.py \
            --db _custody_holdout/ledger.sqlite \
            --oracle _custody_holdout/oracle.json \
            --snapshots _custody_holdout/sealed_candidate_snapshots.json \
            --out _custody_holdout/audit.json | tee heldout_audit.log
          cp _custody_holdout/ledger.sqlite _custody_holdout/modified.sqlite
          python3 - <<'PY'
          import sqlite3
          with sqlite3.connect('_custody_holdout/modified.sqlite') as c:
              c.execute("UPDATE effects SET sources='[\"R\"]' WHERE id=(SELECT MIN(id) FROM effects)")
          PY
          set +e
          python3 experiments/custody/independent_auditor.py \
            --db _custody_holdout/modified.sqlite \
            --oracle _custody_holdout/oracle.json \
            --snapshots _custody_holdout/sealed_candidate_snapshots.json \
            --out _custody_holdout/must_not_appear.json > negative_control.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q AssertionError negative_control.log
          test ! -f _custody_holdout/must_not_appear.json
          echo "NEGATIVE_CONTROL_PASS: SQL effect forgery rejected"
          sha256sum _custody_holdout/ledger.sqlite _custody_holdout/audit.json > result_hashes.txt
      - name: Preserve independent original results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j-custody913-heldout
          path: |
            evaluation_commit.txt
            protocol.log
            source_hashes.txt
            heldout_execution.log
            heldout_audit.log
            negative_control.log
            result_hashes.txt
            _custody_holdout/audit.json
            _custody_holdout/oracle.json
            _custody_holdout/ledger.sqlite
            _custody_holdout/source_snapshot_hashes.json
            _custody_holdout/sealed_candidate_snapshots.json
