name: inventory

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys git
          yosys -V
      - name: Checkout upstream
        run: git clone https://github.com/ZipCPU/zipcpu.git /tmp/upstream
      - name: Extract R0
        run: |
          cd /tmp/upstream
          git reset --hard
          git checkout 128cab89f5edaae4699184f50c1334598ebe904e
          mkdir -p "$GITHUB_WORKSPACE/out"
          yosys -p 'read_verilog -D PIPEMEM -formal rtl/core/pipemem.v; read_verilog -D PIPEMEM -formal rtl/ex/fwb_master.v; prep -top pipemem -nordff; dffunmap; write_json '"$GITHUB_WORKSPACE"'/out/r0.json'
          cd "$GITHUB_WORKSPACE"
          python3 smoke/inventory_json.py out/r0.json | tee out/r0.inventory.json
      - name: Extract R1
        run: |
          cd /tmp/upstream
          git reset --hard
          git checkout d511239e19be8fcc7f340a64554ea93699637e62
          yosys -p 'read_verilog -D PIPEMEM -formal rtl/core/pipemem.v; read_verilog -D PIPEMEM -formal rtl/ex/fwb_master.v; prep -top pipemem -nordff; dffunmap; write_json '"$GITHUB_WORKSPACE"'/out/r1.json'
          cd "$GITHUB_WORKSPACE"
          python3 smoke/inventory_json.py out/r1.json | tee out/r1.inventory.json
      - name: Upload inventories
        uses: actions/upload-artifact@v4
        with:
          name: upstream-formal-inventory
          path: |
            out/r0.inventory.json
            out/r1.inventory.json
