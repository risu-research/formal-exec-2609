name: inventory

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys git
          yosys -V
      - name: Checkout upstream
        run: git clone https://github.com/ZipCPU/zipcpu.git /tmp/upstream
      - name: Extract R0
        run: |
          cd /tmp/upstream
          git reset --hard
          git checkout 128cab89f5edaae4699184f50c1334598ebe904e
          mkdir -p "$GITHUB_WORKSPACE/out"
          yosys -p 'read_verilog -D PIPEMEM -formal rtl/core/pipemem.v; read_verilog -D PIPEMEM -formal rtl/ex/fwb_master.v; prep -top pipemem -nordff; flatten; opt_clean; dffunmap; write_json '"$GITHUB_WORKSPACE"'/out/r0.json; write_smt2 -wires '"$GITHUB_WORKSPACE"'/out/r0.smt2'
          cd "$GITHUB_WORKSPACE"
          python3 smoke/inventory_json.py out/r0.json | tee out/r0.inventory.json
      - name: Extract R1
        run: |
          cd /tmp/upstream
          git reset --hard
          git checkout d511239e19be8fcc7f340a64554ea93699637e62
          yosys -p 'read_verilog -D PIPEMEM -formal rtl/core/pipemem.v; read_verilog -D PIPEMEM -formal rtl/ex/fwb_master.v; prep -top pipemem -nordff; flatten; opt_clean; dffunmap; write_json '"$GITHUB_WORKSPACE"'/out/r1.json; write_smt2 -wires '"$GITHUB_WORKSPACE"'/out/r1.smt2'
          cd "$GITHUB_WORKSPACE"
          python3 smoke/inventory_json.py out/r1.json | tee out/r1.inventory.json
      - name: Upload elaborated generic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upstream-formal-ir
          path: |
            out/r0.inventory.json
            out/r1.inventory.json
            out/r0.json
            out/r1.json
            out/r0.smt2
            out/r1.smt2

  r3_frozen_task_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned original H143 inventory and decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p g6-r1 g6-r2 evidence
          gh run download 35026104546 --repo risu-research/formal-exec-2609 --name g6-r1-exact-historical-inventory-evidence --dir g6-r1
          gh run download 35026795230 --repo risu-research/formal-exec-2609 --name g6-r2-blind-semantic-classification-evidence --dir g6-r2
          echo '2f5caabda7625524a790be6ec94d07e5fda02a9a5eaca9875fe8add858c88161  g6-r1/g6-r1-inventory.json' | sha256sum -c -
          echo '00cc74ac08a15a785eaf7caa601181c16d8a2ee152b735b3e87ae9a3bb981af1  g6-r2/g6-r2-results.json' | sha256sum -c -
      - name: Clone historical first-parent source
        run: |
          set -euo pipefail
          git -c protocol.version=2 clone --filter=blob:none --single-branch --no-checkout https://github.com/ZipCPU/zipcpu.git zipcpu
          git -c protocol.version=2 clone --filter=blob:none --single-branch --no-checkout https://github.com/SymbioticEDA/riscv-formal.git riscv-formal
      - name: Replay exact source trees and candidate formal targets
        run: |
          set -euo pipefail
          python3 research/date-r3-task-replay-20260918/replay.py | tee evidence/runner.log
          cp research/date-r3-task-replay-20260918/replay.py evidence/REPLAY_SOURCE.py
          cp g6-r1/g6-r1-inventory.json evidence/ORIGINAL_G6_R1.json
          cp g6-r2/g6-r2-results.json evidence/ORIGINAL_G6_R2.json
          printf '%s\n' "$GITHUB_SHA" > evidence/runner-commit.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: date-r3-tracked-task-replay-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

  r3_prospective_native_sby:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native formal tools and record exact versions
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git make yosys z3 boolector
          git clone --filter=blob:none --depth=1 https://github.com/YosysHQ/sby.git /tmp/date-r3-sby
          make -C /tmp/date-r3-sby install PREFIX=/tmp/date-r3-tools
          echo '/tmp/date-r3-tools/bin' >> "$GITHUB_PATH"
      - name: Download original H143 authority and source checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p g6-r1 g6-r2 prospect
          gh run download 35026104546 --repo risu-research/formal-exec-2609 --name g6-r1-exact-historical-inventory-evidence --dir g6-r1
          gh run download 35026795230 --repo risu-research/formal-exec-2609 --name g6-r2-blind-semantic-classification-evidence --dir g6-r2
          git -c protocol.version=2 clone --filter=blob:none --single-branch --no-checkout https://github.com/ZipCPU/zipcpu.git zipcpu
          echo "runner_commit=$GITHUB_SHA" > prospect/runner-meta.txt
          git -C /tmp/date-r3-sby rev-parse HEAD >> prospect/runner-meta.txt
      - name: Execute prospectively selected unchanged original SBY on both source revisions
        run: |
          set -euo pipefail
          python3 research/date-r3-task-replay-20260918/prospective_replay.py --zipcpu zipcpu --r1 g6-r1/g6-r1-inventory.json --r2 g6-r2/g6-r2-results.json --out prospect --sby sby | tee prospect/console.log
          cp research/date-r3-task-replay-20260918/prospective_replay.py prospect/REPLAY_SOURCE.py
          cp research/date-r3-task-replay-20260918/PROSPECTIVE_TASK_SELECTION.json prospect/PREREGISTERED_SELECTION.json
          cp g6-r1/g6-r1-inventory.json prospect/ORIGINAL_R1.json
          cp g6-r2/g6-r2-results.json prospect/ORIGINAL_R2.json
          python3 - <<'PY'
          import hashlib,pathlib
          root=pathlib.Path('prospect');files=sorted(p for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt')
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(root))+'\n' for p in files))
          print('CAPSULE_FILES',len(files))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: date-r3-prospective-native-sby-capsule
          path: prospect/
          if-no-files-found: warn
          retention-days: 90
