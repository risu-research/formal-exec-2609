name: Stage29 part-count dose-response and upgrade gate
on:
  push:
    branches: [stage27-part-count]
    paths: [experiments/db_part_curve_gate.py, .github/workflows/db-part-curve-gate.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  part_curve:
    strategy:
      fail-fast: false
      matrix:
        release: ['26.7.1.1315', '26.8.1.2041']
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner and source
        run: |
          df -h .
          free -h
          python3 -m py_compile experiments/db_part_curve_gate.py
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
      - name: Measure matched SF1 physical-state curve
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_part_curve_gate.py '${{ matrix.release }}' 2>&1 | tee stage29-${{ matrix.release }}.log
      - name: Preserve raw receipts and integrity proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage29-ssb-${{ matrix.release }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            stage29-${{ matrix.release }}.log
            s29/${{ matrix.release }}/SOURCE_IDENTITY.json
            s29/${{ matrix.release }}/physical_states.json
            s29/${{ matrix.release }}/answers_sha256.json
            s29/${{ matrix.release }}/query_log.jsonl
            s29/${{ matrix.release }}/receipts.csv
            s29/${{ matrix.release }}/medians.csv
            s29/${{ matrix.release }}/FINAL_STATUS.json
            s29/${{ matrix.release }}/explain/
