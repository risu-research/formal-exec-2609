name: j-6d4f-c
on:
  push:
    branches: ["exec/j-6d4f"]
    paths: ["jobs/j-6d4f/start-c"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          git -C "$RUNNER_TEMP/src" init -q at
          git -C "$RUNNER_TEMP/src/at" remote add origin https://github.com/pagarsky/agent-trace.git
          git -C "$RUNNER_TEMP/src/at" fetch -q --depth 1 origin 3411e2358dee4744a9741715cd80a4a030cd7d0d
          git -C "$RUNNER_TEMP/src/at" checkout -q FETCH_HEAD
          git -C "$RUNNER_TEMP/src" init -q tau
          git -C "$RUNNER_TEMP/src/tau" remote add origin https://github.com/sierra-research/tau-bench.git
          git -C "$RUNNER_TEMP/src/tau" fetch -q --depth 1 origin 59a200c6d575d595120f1cb70fea53cef0632f6b
          git -C "$RUNNER_TEMP/src/tau" checkout -q FETCH_HEAD
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runs/j-6d4f/a2
          mkdir -p runs/j-6d4f/a2
          python -m py_compile jobs/j-6d4f/audit2.py
          python jobs/j-6d4f/audit2.py runs/j-6d4f/a2 "$RUNNER_TEMP/src" | tee runs/j-6d4f/a2/stdout.txt
          sha256sum runs/j-6d4f/a2/audit.json runs/j-6d4f/a2/x.csv runs/j-6d4f/a2/y.csv runs/j-6d4f/a2/sample.json > runs/j-6d4f/a2/manifest.txt
      - name: Seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/j-6d4f/a2
          git commit -m 'Seal j-6d4f-c output' || true
          git push origin HEAD:exec/j-6d4f
      - uses: actions/upload-artifact@v4
        with:
          name: j-6d4f-c
          path: runs/j-6d4f/a2
          if-no-files-found: error
