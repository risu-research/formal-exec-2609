name: semantic-kernel

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install formal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git python3 python3-pip
          python3 -m pip install --break-system-packages z3-solver
          yosys -V | tee tool-yosys.txt
          z3 --version | tee tool-z3.txt
      - name: Adversarial order calculus gate
        run: |
          PYTHONPATH=smoke python3 smoke/test_scope_logic.py | tee scope-order-gate.log

      - name: Extract natural revision pair and upstream provenance
        run: |
          set -euo pipefail
          git clone -q https://github.com/ZipCPU/zipcpu.git /tmp/natural
          mkdir -p out/natural
          cd /tmp/natural
          git show -s --format=fuller d511239e19be8fcc7f340a64554ea93699637e62 > "$GITHUB_WORKSPACE/out/natural/upstream-child-commit.txt"
          git diff 128cab89f5edaae4699184f50c1334598ebe904e d511239e19be8fcc7f340a64554ea93699637e62 -- rtl/core/pipemem.v > "$GITHUB_WORKSPACE/out/natural/upstream-pipemem.diff"
          git checkout -q 128cab89f5edaae4699184f50c1334598ebe904e
          yosys -p 'read_verilog -D PIPEMEM -formal rtl/core/pipemem.v; read_verilog -D PIPEMEM -formal rtl/ex/fwb_master.v; prep -top pipemem -flatten -nordff; dffunmap; write_json '"$GITHUB_WORKSPACE"'/out/natural/r0.json; write_smt2 -wires '"$GITHUB_WORKSPACE"'/out/natural/r0.smt2'
          git reset --hard -q
          git checkout -q d511239e19be8fcc7f340a64554ea93699637e62
          yosys -p 'read_verilog -D PIPEMEM -formal rtl/core/pipemem.v; read_verilog -D PIPEMEM -formal rtl/ex/fwb_master.v; prep -top pipemem -flatten -nordff; dffunmap; write_json '"$GITHUB_WORKSPACE"'/out/natural/r1.json; write_smt2 -wires '"$GITHUB_WORKSPACE"'/out/natural/r1.smt2'

      - name: Natural semantic closure
        run: |
          set -euo pipefail
          python3 smoke/vocabulary_audit.py out/natural/r0.json out/natural/r1.json --require-external-identity | tee out/natural/vocabulary.json
          python3 smoke/tnf_scope.py out/natural/r0.json out/natural/r1.json --expect INCOMPARABLE | tee out/natural/tnf.json
          PYTHONPATH=smoke python3 smoke/semantic_witness.py out/natural/r0.json out/natural/r1.json | tee out/natural/semantic-witness.json
          python3 smoke/validate_tnf_smt2.py out/natural/r0.json out/natural/r0.smt2 | tee out/natural/r0.tnf-theorem.json
          python3 smoke/validate_tnf_smt2.py out/natural/r1.json out/natural/r1.smt2 | tee out/natural/r1.tnf-theorem.json

      - name: Build controlled contraction mirror
        run: |
          set -euo pipefail
          git clone -q https://github.com/ZipCPU/zipcpu.git /tmp/mirror
          mkdir -p out/mirror
          cd /tmp/mirror
          git checkout -q d511239e19be8fcc7f340a64554ea93699637e62
          yosys -p 'read_verilog -D PIPEMEM -formal rtl/core/pipemem.v; read_verilog -D PIPEMEM -formal rtl/ex/fwb_master.v; prep -top pipemem -flatten -nordff; dffunmap; write_json '"$GITHUB_WORKSPACE"'/out/mirror/base.json; write_smt2 -wires '"$GITHUB_WORKSPACE"'/out/mirror/base.smt2'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rtl/core/pipemem.v'); s=p.read_text()
          old="""//always @(posedge i_clk)\n//\tif ((f_past_valid)&&($past(f_cyc))&&(!$past(i_lock)))\n//\t\t`ASSUME(!i_lock);\n"""
          new="""always @(posedge i_clk)\n\tif ((f_past_valid)&&($past(f_cyc))&&(!$past(i_lock)))\n\t\t`ASSUME(!i_lock);\n"""
          if old not in s: raise SystemExit('mirror anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          yosys -p 'read_verilog -D PIPEMEM -formal rtl/core/pipemem.v; read_verilog -D PIPEMEM -formal rtl/ex/fwb_master.v; prep -top pipemem -flatten -nordff; dffunmap; write_json '"$GITHUB_WORKSPACE"'/out/mirror/mutant.json; write_smt2 -wires '"$GITHUB_WORKSPACE"'/out/mirror/mutant.smt2'

      - name: Mirror semantic closure
        run: |
          set -euo pipefail
          python3 smoke/vocabulary_audit.py out/mirror/base.json out/mirror/mutant.json --require-external-identity | tee out/mirror/vocabulary.json
          python3 smoke/tnf_scope.py out/mirror/base.json out/mirror/mutant.json --expect CONTRACT | tee out/mirror/tnf.json
          PYTHONPATH=smoke python3 smoke/semantic_witness.py out/mirror/base.json out/mirror/mutant.json | tee out/mirror/semantic-witness.json
          python3 smoke/validate_tnf_smt2.py out/mirror/base.json out/mirror/base.smt2 | tee out/mirror/base.tnf-theorem.json
          python3 smoke/validate_tnf_smt2.py out/mirror/mutant.json out/mirror/mutant.smt2 | tee out/mirror/mutant.tnf-theorem.json

      - name: G3 independent metamorphic closure
        run: |
          set -euo pipefail
          PYTHONPATH=smoke python3 smoke/g3_metamorphic.py \
            --natural-old out/natural/r0.json \
            --natural-new out/natural/r1.json \
            --mirror-old out/mirror/base.json \
            --mirror-new out/mirror/mutant.json \
            --out out/g3-metamorphic.json | tee out/g3-metamorphic.log

      - name: Seal semantic authority
        if: always()
        run: |
          cp tool-yosys.txt tool-z3.txt scope-order-gate.log out/ 2>/dev/null || true
          git rev-parse HEAD > out/harness.commit.txt
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt || true
      - name: Upload semantic closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-scope-semantic-kernel
          path: out/
