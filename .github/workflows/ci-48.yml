name: ci-48
on:
  push:
    branches: [ci48-neutral-run]
    paths: [.github/workflows/ci-48.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check neutral SQL suite
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/db_c48.py
          python3 experiments/db_c48.py --preflight
          if grep -iE '(moon.?hwan|northwestern|@hotmail|@risuinstitute|password=|bearer [a-z0-9_-]+)' experiments/db_c48.py; then exit 1; fi
          sha256sum experiments/db_c48.py experiments/db_tpch_join_boundary.py > c48_result/SOURCE_SHA256.txt
      - name: Execute SQL pairs
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_c48.py
      - name: Save result records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c48-sql-check
          path: c48_result/
          retention-days: 14
