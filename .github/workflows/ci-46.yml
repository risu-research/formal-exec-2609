name: ci-46
on:
  push:
    branches: [stage39-independent-replication]
    paths:
      - .github/workflows/ci-46.yml
      - experiments/db_c46.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  paired-history-mixed-stream:
    name: mixed-trace-${{ matrix.cap }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cap: [300000, 1500000]
    steps:
      - uses: actions/checkout@v4
      - name: Record exact source and host
        env:
          CAP: ${{ matrix.cap }}
        run: |
          set -euo pipefail
          mkdir -p audit46
          {
            echo "cap=$CAP"
            echo "sha=$GITHUB_SHA"
            date -u '+utc=%FT%TZ'
            uname -a
            nproc
            free -h
            df -h .
            sha256sum experiments/db_c46.py experiments/db_c45.py experiments/db_c42.py experiments/db_mixed_history_upgrade.py experiments/db_tpch_join_boundary.py
          } > audit46/host.txt
          python3 -m py_compile experiments/db_c46.py
      - name: Execute 26.7 inheritance and actual 26.8 mixed streams
        env:
          C46_CAP: ${{ matrix.cap }}
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_c46.py 2>&1 | tee audit46/trace.log
      - name: Preserve checkpoint and raw receipts regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c46-${{ matrix.cap }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            audit46/
            c46_${{ matrix.cap }}/
