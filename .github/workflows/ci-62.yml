name: ci-62
on:
  push:
    branches: [ci62-balanced-probe]
    paths: [experiments/db_c62.py, .github/workflows/ci-62.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  first-warm-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        run_group: [a, b]
    env:
      RUN_GROUP: ${{ matrix.run_group }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/db_c61.py experiments/db_c62.py
          sha256sum experiments/db_c61.py experiments/db_c62.py > SOURCE_SHA256.txt
      - name: Evaluate balanced controls
        run: |
          set -o pipefail
          python3 experiments/db_c62.py 2>&1 | tee progress.log
      - name: Retain data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci62-${{ matrix.run_group }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            SOURCE_SHA256.txt
            progress.log
            c62/PREREGISTRATION.json
            c62/FINAL_DECISIONS.json
            c62/FINAL_STATUS.json
            c62/PER_SQL.json
            c62/receipts.csv
            c62/query_log.jsonl
            c62/ANSWER_HASHES.json
            c62/orders/
            c62/before/
            c62/after/
            c62/original/
            c62/target_inherited/
            c62/SOURCE_IDENTITY.json
