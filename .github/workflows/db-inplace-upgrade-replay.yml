name: Stage30 in-place 26.7 to 26.8 retained-parts replay
on:
  push:
    branches: [stage27-part-count]
    paths:
      - experiments/db_inplace_upgrade_replay.py
      - .github/workflows/db-inplace-upgrade-replay.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inplace_replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - name: Validate environment
        run: |
          python3 -m py_compile experiments/db_inplace_upgrade_replay.py
          df -h .
          free -h
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
      - name: Reboot same ClickHouse volume across pinned images
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_inplace_upgrade_replay.py 2>&1 | tee stage30-run.log
      - name: Preserve pre-sham-upgrade evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage30-inplace-upgrade-replay
          retention-days: 14
          if-no-files-found: warn
          path: |
            stage30-run.log
            s30/SOURCE_IDENTITY.json
            s30/FINAL_STATUS.json
            s30/gate_matrix.csv
            s30/before/
            s30/sham_restart/
            s30/upgraded/
