name: j-6d4f-g
on:
  push:
    branches: ["exec/j-6d4f"]
    paths: ["jobs/j-6d4f/start-g"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runs/j-6d4f/a5
          mkdir -p runs/j-6d4f/a5
          python jobs/j-6d4f/r5.py runs/j-6d4f/a4/z.csv runs/j-6d4f/a5 | tee runs/j-6d4f/a5/stdout.txt
          sha256sum runs/j-6d4f/a5/r5.json > runs/j-6d4f/a5/manifest.txt
      - name: Seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/j-6d4f/a5
          git commit -m 'Seal j-6d4f-g output' || true
          git push origin HEAD:exec/j-6d4f
