name: reproducibility-snapshot
on:
  push:
    branches: [ci48-neutral-run]
    paths: [.github/workflows/ci-evidence-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive neutral experiment sources
        run: |
          set -euo pipefail
          mkdir -p snapshot/experiments snapshot/workflows
          cp experiments/db_c4{8,9}.py experiments/db_c5{0,1,2,3,4,5,6}.py snapshot/experiments/
          cp .github/workflows/ci-{48,49,50,51,52,53,54,55,56}.yml snapshot/workflows/
          (cd snapshot && find experiments workflows -type f -print0 | sort -z | xargs -0 sha256sum) >snapshot/SHA256SUMS.txt
          git rev-parse HEAD >snapshot/SOURCE_COMMIT.txt
          grep -R -nEi 'moon.?hwan|@hotmail|@risuinstitute|bearer [a-z0-9_-]+' snapshot/experiments && exit 1 || test "$?" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: neutral-source-snapshot
          retention-days: 14
          path: snapshot/
