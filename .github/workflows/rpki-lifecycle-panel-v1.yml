name: rpki-lifecycle-panel-v1
on:
  workflow_dispatch:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - rpki_lifecycle_panel_v1.py
      - results/rpki_population_v1_20261002/**
      - .github/workflows/rpki-lifecycle-panel-v1.yml
permissions:
  contents: write
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Screen context and reconstruct lifecycle panel
        run: python3 rpki_lifecycle_panel_v1.py
      - name: Commit lifecycle evidence if present
        run: |
          if [ ! -f results/rpki_lifecycle_panel_v1_20261002/summary.json ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpki_lifecycle_panel_v1_20261002
          git commit -m "add expanded RPKI lifecycle panel [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpki-lifecycle-panel-v1-20261002
          path: results/rpki_lifecycle_panel_v1_20261002
          if-no-files-found: ignore
# manual trigger marker after population freeze: 2026-10-02
