name: Stage31 ClickHouse statistics DETACH ATTACH restart
on:
  push:
    branches: [stage27-part-count]
    paths:
      - experiments/db_statistics_lifecycle.py
      - .github/workflows/db-statistics-lifecycle.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: |
          python3 -m py_compile experiments/db_statistics_lifecycle.py
          df -h .
          free -h
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
      - name: Five-stage 26.8 metadata and statistics lifecycle
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_statistics_lifecycle.py 2>&1 | tee stage31.log
      - name: Persist physical checks and query logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage31-statistics-lifecycle
          retention-days: 14
          if-no-files-found: warn
          path: |
            stage31.log
            s31/SOURCE_IDENTITY.json
            s31/FINAL_STATUS.json
            s31/medians_all.csv
            s31/baseline/
            s31/reattached/
            s31/restarted/
            s31/post_insert/
            s31/post_reattached/
