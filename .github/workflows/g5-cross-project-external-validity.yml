# Execution trigger only. Scientific protocol/case matrix is frozen privately at
# 7431896cc5ccb8420f248d2d66409e408d4c16f1 before this workflow's first verdict-bearing run.
name: g5-cross-project-external-validity

on:
  workflow_dispatch:
  push:
    paths:
      - 'smoke/g5_cross_project_external_validity.py'
      - '.github/workflows/g5-cross-project-external-validity.yml'

permissions:
  contents: read

jobs:
  external_validity:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Install execution dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys git python3 python3-pip unzip curl
          python3 -m pip install --break-system-packages z3-solver
          yosys -V
          python3 - <<'PY'
          import z3
          print('z3', z3.get_version_string())
          assert z3.get_version_string() == '5.1.0'
          PY

      - name: Install pinned cvc5
        run: |
          mkdir -p /tmp/g5-tools
          curl -L --fail --retry 3 -o /tmp/g5-tools/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-static.zip
          echo 'dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6  /tmp/g5-tools/cvc5.zip' | sha256sum -c -
          unzip -q /tmp/g5-tools/cvc5.zip -d /tmp/g5-tools/cvc5
          CVC5=$(find /tmp/g5-tools/cvc5 -type f -name cvc5 | head -1)
          test -x "$CVC5"
          echo "CVC5=$CVC5" >> "$GITHUB_ENV"
          "$CVC5" --version

      - name: Checkout exact riscv-formal substrate
        run: |
          rm -rf riscv-formal
          mkdir riscv-formal
          cd riscv-formal
          git init -q
          git remote add origin https://github.com/YosysHQ/riscv-formal.git
          git sparse-checkout init --no-cone
          git sparse-checkout set \
            cores/picorv32/honest.sv \
            cores/picorv32/honest.sby \
            cores/picorv32/complete.sby \
            checks/rvfi_macros.vh
          git fetch -q --depth=1 --filter=blob:none origin c992aa61fdfe0846c5ed90324c596202a1c69b76
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "c992aa61fdfe0846c5ed90324c596202a1c69b76"

      - name: Checkout exact Picorv32 dependency
        run: |
          rm -rf picorv32
          mkdir picorv32
          cd picorv32
          git init -q
          git remote add origin https://github.com/YosysHQ/picorv32.git
          git sparse-checkout init --no-cone
          git sparse-checkout set picorv32.v
          git fetch -q --depth=1 --filter=blob:none origin ef203c2b0a3fb793280f5114941416c425c5b461
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "ef203c2b0a3fb793280f5114941416c425c5b461"

      - name: Checkout exact OpenTitan substrate
        run: |
          rm -rf opentitan
          mkdir opentitan
          cd opentitan
          git init -q
          git remote add origin https://github.com/lowRISC/opentitan.git
          git sparse-checkout init --no-cone
          git sparse-checkout set \
            hw/top_earlgrey/ip_autogen/rv_plic/fpv/vip/rv_plic_assert_fpv.sv \
            hw/top_earlgrey/ip_autogen/rv_plic/rtl/rv_plic_gateway.sv \
            hw/top_earlgrey/ip_autogen/rv_plic/rtl/rv_plic_reg_pkg.sv \
            hw/top_earlgrey/ip_autogen/rv_plic/fpv/tb/rv_plic_bind_fpv.sv \
            hw/ip/prim/rtl/prim_assert.sv \
            hw/top_earlgrey/ip_autogen/rv_plic/fpv/rv_plic_fpv.core \
            hw/top_earlgrey/formal/top_earlgrey_fpv_ip_cfgs.hjson \
            hw/formal/tools/dvsim/common_fpv_cfg.hjson \
            hw/formal/tools/dvsim/common_formal_cfg.hjson \
            hw/top_earlgrey/ip_autogen/rv_plic/data/rv_plic_fpv_testplan.hjson
          git fetch -q --depth=1 --filter=blob:none origin 2fd79ed9834f95f50daa84ffabcb1ff6fe1c874b
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "2fd79ed9834f95f50daa84ffabcb1ff6fe1c874b"

      - name: Execute frozen G5 cross-project gate
        run: |
          rm -rf g5-work g5-evidence
          mkdir -p g5-work g5-evidence
          set +e
          python3 smoke/g5_cross_project_external_validity.py \
            --riscv-formal riscv-formal \
            --picorv32 picorv32 \
            --opentitan opentitan \
            --cvc5 "$CVC5" \
            --work g5-work \
            --out g5-evidence 2>&1 | tee g5-evidence/runner.log
          RC=${PIPESTATUS[0]}
          printf '%s\n' "$RC" > g5-evidence/runner-returncode.txt
          exit "$RC"

      - name: Seal G5 evidence
        if: always()
        run: |
          mkdir -p g5-evidence
          printf '%s\n' "$GITHUB_SHA" > g5-evidence/public-runner-head.txt
          printf '%s\n' '7431896cc5ccb8420f248d2d66409e408d4c16f1' > g5-evidence/g5-pre-result-freeze-head.txt
          printf '%s\n' '326aaf40203a3fcb6f3b891a488684ddf6ee9090' > g5-evidence/g4-parent-head.txt
          git -C riscv-formal rev-parse HEAD > g5-evidence/riscv-formal-head.txt 2>/dev/null || true
          git -C picorv32 rev-parse HEAD > g5-evidence/picorv32-head.txt 2>/dev/null || true
          git -C opentitan rev-parse HEAD > g5-evidence/opentitan-head.txt 2>/dev/null || true
          yosys -V > g5-evidence/yosys-version.txt 2>&1 || true
          python3 - <<'PY' > g5-evidence/z3-version.txt 2>&1 || true
          import z3
          print(z3.get_version_string())
          PY
          "$CVC5" --version > g5-evidence/cvc5-version.txt 2>&1 || true
          find g5-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > g5-evidence/SHA256SUMS.txt || true

      - name: Upload G5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-cross-project-evidence
          path: g5-evidence/
          if-no-files-found: warn
          retention-days: 90
