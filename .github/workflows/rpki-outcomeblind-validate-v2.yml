name: rpki-outcomeblind-validate-v2
on:
  workflow_dispatch:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - rpki_outcomeblind_validate_v2.py
      - .github/workflows/rpki-outcomeblind-validate-v2.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Reclassify frozen exact set with prior validator
        run: python3 rpki_outcomeblind_validate_v2.py
      - name: Commit aligned evidence
        run: |
          test -f results/rpki_outcomeblind_validate_v2_20261002/summary.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpki_outcomeblind_validate_v2_20261002
          git commit -m "add validator-aligned outcome-blind RPKI evidence [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpki-outcomeblind-validate-v2-20261002
          path: results/rpki_outcomeblind_validate_v2_20261002
          if-no-files-found: ignore
