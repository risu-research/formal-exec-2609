name: rpki-lifecycle-panel-v1b
on:
  workflow_dispatch:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - rpki_lifecycle_panel_v1b.py
      - rpki_lifecycle_refine_v2.py
      - .github/workflows/rpki-lifecycle-panel-v1b.yml
permissions:
  contents: write
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Reconstruct corrected expanded lifecycle panel
        run: python3 rpki_lifecycle_panel_v1b.py
      - name: Realign lifecycle to exact multi-RRC BGP date
        run: python3 rpki_lifecycle_refine_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: rpki-lifecycle-panel-v1b-v2-20261002
          path: |
            results/rpki_lifecycle_panel_v1_20261002
            results/rpki_lifecycle_refine_v2_20261002
