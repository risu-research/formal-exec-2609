name: ci-53
on:
  push:
    branches: [ci48-neutral-run]
    paths: [.github/workflows/ci-53.yml, experiments/db_c53.py]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  month-batch-stress:
    name: Fixed D4 / batches=${{ matrix.batches }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        batches: [1, 4, 8]
    env:
      C53_BATCHES: ${{ matrix.batches }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and predeclared batching
        run: |
          set -euo pipefail
          mkdir -p audit53
          sha256sum experiments/db_c42.py experiments/db_c50.py experiments/db_c52.py experiments/db_c53.py > audit53/SOURCE_SHA256.txt
          python3 -m py_compile experiments/db_c53.py
          if grep -iE '(moon.?hwan|northwestern|@hotmail|@risuinstitute|password=|bearer [a-z0-9_-]+)' experiments/db_c53.py; then exit 1; fi
          python3 experiments/db_c53.py --preflight
      - name: Preserve-version upgrade and natural merges; measure unchanged SQL
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_c53.py 2>&1 | tee audit53/progress.log
      - name: Keep audit artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c53-b${{ matrix.batches }}-audit
          retention-days: 14
          if-no-files-found: warn
          path: |
            audit53/
            s53_batch${{ matrix.batches }}/PREREGISTERED.json
            s53_batch${{ matrix.batches }}/SOURCE_IDENTITY.json
            s53_batch${{ matrix.batches }}/calendar.json
            s53_batch${{ matrix.batches }}/settings.tsv
            s53_batch${{ matrix.batches }}/FINAL_STATUS.json
            s53_batch${{ matrix.batches }}/SELECTED.json
            s53_batch${{ matrix.batches }}/old_state/state.json
            s53_batch${{ matrix.batches }}/post_ingest/state.json
            s53_batch${{ matrix.batches }}/post_ingest/original_answers_verified.json
            s53_batch${{ matrix.batches }}/post_ingest/new_sql_answers.json
            s53_batch${{ matrix.batches }}/post_ingest/results.json
            s53_batch${{ matrix.batches }}/post_ingest/decision.json
            s53_batch${{ matrix.batches }}/post_ingest/validation.json
            s53_batch${{ matrix.batches }}/post_ingest/receipts.csv
            s53_batch${{ matrix.batches }}/later/state.json
            s53_batch${{ matrix.batches }}/later/original_answers_verified.json
            s53_batch${{ matrix.batches }}/later/new_sql_answers.json
            s53_batch${{ matrix.batches }}/later/results.json
            s53_batch${{ matrix.batches }}/later/decision.json
            s53_batch${{ matrix.batches }}/later/validation.json
            s53_batch${{ matrix.batches }}/later/receipts.csv
