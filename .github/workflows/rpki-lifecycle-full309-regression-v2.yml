name: rpki-lifecycle-full309-regression-v2
on:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - .github/workflows/rpki-lifecycle-full309-regression-v2.yml
      - rpki_lifecycle_full309_regression_v2.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Recover corrected prior-185 lifecycle authority
        run: |
          mkdir -p /tmp/corrected
          gh api repos/risu-research/formal-exec-2609/actions/artifacts/11250075385/zip > /tmp/corrected.zip
          unzip -o /tmp/corrected.zip -d /tmp/corrected
          find /tmp/corrected -maxdepth 3 -type f -print
      - name: Regression audit full 309 lifecycle
        run: python3 rpki_lifecycle_full309_regression_v2.py /tmp/corrected
      - name: Show summary
        run: cat results/rpki_lifecycle_full309_regression_v2_20261002/summary.json
      - name: Commit corrected regression evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpki_lifecycle_full309_regression_v2_20261002
          git commit -m "add corrected 185-to-309 lifecycle regression [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpki-lifecycle-full309-regression-v2-20261002
          path: results/rpki_lifecycle_full309_regression_v2_20261002
          if-no-files-found: ignore
