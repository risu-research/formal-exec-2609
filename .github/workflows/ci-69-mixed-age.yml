name: ci-69-mixed-age
on:
  push:
    branches: [ci69-mixed-age-deployment]
    paths: [experiments/db_c69_mixed_age.py, .github/workflows/ci-69-mixed-age.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  deployment-histories:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        restart: [0, 1]
        group: [a, b, c]
    env:
      C69_RESTART: ${{ matrix.restart }}
      C68_RESTART: ${{ matrix.restart }}
      C68_REPS: "4"
      RUN_GROUP: ${{ matrix.group }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Compile and source identity
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/db_c69_mixed_age.py experiments/db_c68_http_client.py experiments/db_c42.py experiments/db_mixed_history_upgrade.py
          sha256sum experiments/db_c69_mixed_age.py experiments/db_c68_http_client.py experiments/db_c42.py experiments/db_mixed_history_upgrade.py > SOURCE_SHA256.txt
      - name: Run mixed-age full-response audit
        run: |
          set -o pipefail
          python3 experiments/db_c69_mixed_age.py 2>&1 | tee progress.log
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c69-r${{ matrix.restart }}-${{ matrix.group }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            SOURCE_SHA256.txt
            progress.log
            c69/PRESPECIFICATION.json
            c69/SOURCE_IDENTITY.json
            c69/month_plan.json
            c69/decision_matrix.csv
            c69/FINAL_STATUS.json
            c69/before_version_restart/
            c69/old_sham_before/
            c69/old_sham/
            c69/old_sham_after/
            c69/target_before_rebuild/
            c69/target_before_measure/
            c69/target/
            c69/target_after_measure/
