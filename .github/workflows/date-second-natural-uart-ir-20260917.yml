name: date-second-natural-uart-ir-20260917
on:
  push:
    branches: [research/date-second-natural-20260917]
    paths: [.github/workflows/date-second-natural-uart-ir-20260917.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-paired-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y yosys git
          mkdir -p uart-ir-evidence
          yosys -V > uart-ir-evidence/tools.txt
      - name: Export original historical formal target on both sides
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/ZipCPU/wbuart32.git /tmp/wbuart32
          for item in old:2270d473bed97748f444537dc05a39eb6bcc0f6a new:e13a7f30d6dce7579dd90285ceb9327a0ed80bbc; do
            name="${item%%:*}"; sha="${item#*:}"
            git -C /tmp/wbuart32 checkout -q --detach "$sha"
            git -C /tmp/wbuart32 rev-parse HEAD > "uart-ir-evidence/$name.sha"
            (cd /tmp/wbuart32/bench/formal && yosys -Q -T -l "$GITHUB_WORKSPACE/uart-ir-evidence/$name.yosys.log" -p 'read_verilog -formal -DTXUARTLITE ../../rtl/txuartlite.v; prep -top txuartlite -flatten; write_json '"$GITHUB_WORKSPACE/uart-ir-evidence/$name.json")
            python3 - "$name" <<'PY'
          import hashlib,json,sys,pathlib
          n=sys.argv[1];p=pathlib.Path('uart-ir-evidence')/f'{n}.json';d=json.loads(p.read_text());m=d['modules']['txuartlite'];cells=m['cells']; cnt={t:sum(c['type']==t for c in cells.values()) for t in ('$assume','$assert','$restrict','$cover','$dff','$sdff','$adff')}; out={'revision':n,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'cells':len(cells),'formal_counts':cnt,'ports':list(m.get('ports',{}))};(p.parent/f'{n}.inventory.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n');print(json.dumps(out,sort_keys=True))
          PY
          done
          sha256sum uart-ir-evidence/*.json > uart-ir-evidence/SHA256SUMS.txt
      - name: Preserve exact formal-target JSON and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: date-second-natural-uart-ir-20260917
          path: uart-ir-evidence/
          if-no-files-found: warn
          retention-days: 90
