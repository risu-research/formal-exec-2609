name: g3-metamorphic-cert

on:
  push:
    paths:
      - '.github/workflows/g3-metamorphic-cert.yml'
      - 'smoke/g3_preserving_inputs.py'
      - 'smoke/g3_emit_semantic_xor.py'
      - 'smoke/g3_emit_aggregate_correspondence.py'
      - 'smoke/g3_emit_aggregate_correspondence_v4.py'
      - 'smoke/tnf_scope.py'
      - 'smoke/validate_tnf_smt2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserving-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned proof toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip git build-essential cmake libgmp-dev yosys python3 python3-pip
          mkdir -p /tmp/g3-tools out/signatures
          python3 -m pip install --break-system-packages z3-solver==5.1.0.0
          python3 -m pip show z3-solver | tee out/z3-package.txt
          grep -qx 'Version: 5.1.0.0' out/z3-package.txt
          curl -L --fail --retry 3 -o /tmp/g3-tools/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-static.zip
          echo 'dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6  /tmp/g3-tools/cvc5.zip' | sha256sum -c -
          unzip -q /tmp/g3-tools/cvc5.zip -d /tmp/g3-tools/cvc5
          CVC5=$(find /tmp/g3-tools/cvc5 -type f -name cvc5 | head -n1); test -x "$CVC5"; echo "CVC5=$CVC5" >> "$GITHUB_ENV"
          git clone -q --branch cvc5-1.3.4 --depth 1 https://github.com/cvc5/cvc5.git /tmp/g3-tools/cvc5-src
          cp -a /tmp/g3-tools/cvc5-src/proofs/eo/cpc/. out/signatures/
          git -C /tmp/g3-tools/cvc5-src rev-parse HEAD | tee out/cvc5-source.commit.txt
          find out/signatures -type f -print0 | sort -z | xargs -0 sha256sum > out/cpc-signatures.sha256
          git clone -q https://github.com/cvc5/ethos.git /tmp/g3-tools/ethos
          git -C /tmp/g3-tools/ethos checkout -q 221641668d75eaffd308e0511d63962cea937110
          cmake -S /tmp/g3-tools/ethos -B /tmp/g3-tools/ethos/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/g3-tools/ethos/build -j2
          ETHOS=/tmp/g3-tools/ethos/build/src/ethos; test -x "$ETHOS"; echo "ETHOS=$ETHOS" >> "$GITHUB_ENV"
          "$CVC5" --version | tee out/cvc5.version.txt
          yosys -V | tee out/yosys.version.txt
          grep -q '^Yosys 0.33 ' out/yosys.version.txt
          python3 - <<'PY' | tee out/z3.version.txt
          import z3
          print(z3.get_version_string())
          assert z3.get_version_string() == '5.1.0'
          PY
          git -C /tmp/g3-tools/ethos rev-parse HEAD | tee out/ethos.commit.txt
          sha256sum "$CVC5" "$ETHOS" "$(command -v yosys)" > out/tool-binaries.sha256

      - name: Build frozen four-artifact calibration corpus
        run: |
          set -euo pipefail
          OLD=128cab89f5edaae4699184f50c1334598ebe904e
          NEW=d511239e19be8fcc7f340a64554ea93699637e62
          git clone -q https://github.com/ZipCPU/zipcpu.git /tmp/g3-meta
          mkdir -p out/base
          cd /tmp/g3-meta
          git checkout -q "$OLD"
          yosys -q -p 'read_verilog -D PIPEMEM -formal rtl/core/pipemem.v; read_verilog -D PIPEMEM -formal rtl/ex/fwb_master.v; prep -top pipemem -flatten -nordff; dffunmap; write_json '"$GITHUB_WORKSPACE"'/out/base/natural_old.json'
          git reset --hard -q; git checkout -q "$NEW"
          yosys -q -p 'read_verilog -D PIPEMEM -formal rtl/core/pipemem.v; read_verilog -D PIPEMEM -formal rtl/ex/fwb_master.v; prep -top pipemem -flatten -nordff; dffunmap; write_json '"$GITHUB_WORKSPACE"'/out/base/natural_new.json'
          cp "$GITHUB_WORKSPACE/out/base/natural_new.json" "$GITHUB_WORKSPACE/out/base/mirror_old.json"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rtl/core/pipemem.v'); s=p.read_text()
          old="""//always @(posedge i_clk)\n//\tif ((f_past_valid)&&($past(f_cyc))&&(!$past(i_lock)))\n//\t\t`ASSUME(!i_lock);\n"""
          new="""always @(posedge i_clk)\n\tif ((f_past_valid)&&($past(f_cyc))&&(!$past(i_lock)))\n\t\t`ASSUME(!i_lock);\n"""
          if old not in s: raise SystemExit('mirror anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          yosys -q -p 'read_verilog -D PIPEMEM -formal rtl/core/pipemem.v; read_verilog -D PIPEMEM -formal rtl/ex/fwb_master.v; prep -top pipemem -flatten -nordff; dffunmap; write_json '"$GITHUB_WORKSPACE"'/out/base/mirror_new.json'
          cd "$GITHUB_WORKSPACE"
          sha256sum out/base/*.json > out/base/SHA256SUMS.txt

      - name: Emit all frozen preserving families
        run: |
          set -euo pipefail
          for label in natural_old natural_new mirror_old mirror_new; do
            PYTHONPATH=smoke python3 smoke/g3_preserving_inputs.py --input "out/base/$label.json" --label "$label" --out out/meta | tee "out/meta-$label.log"
          done
          test "$(find out/meta -mindepth 2 -maxdepth 2 -name '*.json' ! -name manifest.json | wc -l)" -eq 40

      - name: Emit preserving, undef-bridge, and solver-correspondence queries
        run: |
          set -euo pipefail
          mkdir -p out/queries/preserving out/queries/undef_irrelevance out/queries/correspondence out/solver
          for j in out/meta/*/*.json; do
            [[ $(basename "$j") == manifest.json ]] && continue
            label=$(basename "$(dirname "$j")"); family=$(basename "$j" .json)
            mkdir -p "out/queries/preserving/$label" "out/queries/undef_irrelevance/$label" "out/queries/correspondence/$label" "out/solver/$label"
            PYTHONPATH=smoke python3 smoke/g3_emit_semantic_xor.py "out/base/$label.json" "$j" "out/queries/preserving/$label/$family.smt2" > "out/queries/preserving/$label/$family.json"
            yosys -q -p "read_json $j; write_smt2 -wires out/solver/$label/$family.smt2"
            PYTHONPATH=smoke python3 smoke/g3_emit_aggregate_correspondence_v4.py "$j" "out/solver/$label/$family.smt2" "out/queries/correspondence/$label/$family.smt2" "out/queries/undef_irrelevance/$label/$family.smt2" > "out/queries/correspondence/$label/$family.json"
          done
          test "$(find out/queries/preserving -name '*.smt2' | wc -l)" -eq 40
          test "$(find out/queries/undef_irrelevance -name '*.smt2' | wc -l)" -eq 40
          test "$(find out/queries/correspondence -name '*.smt2' | wc -l)" -eq 40

      - name: CPC and Ethos certify all 120 preserving obligations
        id: cert
        run: |
          set -euo pipefail
          mkdir -p out/proofs
          printf 'lane\tlabel\tfamily\tquery_sha256\tstatus\n' > out/METAMORPHIC_CERTIFICATES.tsv
          bad=0; count=0
          certify () {
            lane="$1"; q="$2"; label=$(basename "$(dirname "$q")"); family=$(basename "$q" .smt2)
            id="${lane}__${label}__${family}"; raw="out/proofs/$id.raw"; proof="out/proofs/$id.cpc"; log="out/proofs/$id.ethos"; altered="out/proofs/$id.altered.cpc"; alog="out/proofs/$id.altered.ethos"
            qsha=$(sha256sum "$q" | awk '{print $1}'); status=UNSET
            set +e
            timeout 300 "$CVC5" --produce-proofs --proof-mode=full-proof-strict --dump-proofs --proof-format-mode=cpc --proof-granularity=dsl-rewrite-strict --dag-thresh=0 "$q" > "$raw" 2> "out/proofs/$id.cvc5.err"
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then status="CVC5_FAIL_$rc"
            elif [[ "$(head -n1 "$raw")" != unsat ]]; then
              first=$(head -n1 "$raw" | tr -dc 'A-Za-z0-9_-'); status="NOT_UNSAT_${first}"
              set +e
              timeout 120 "$CVC5" --produce-models --dump-models "$q" > "out/proofs/$id.model.txt" 2> "out/proofs/$id.model.err"
              set -e
            else
              { echo '(include "../signatures/Cpc.eo")'; echo '(include "../signatures/expert/CpcExpert.eo")'; tail -n +3 "$raw" | head -n -1; } > "$proof"
              if grep -Eiq 'WARNING|(^|[^[:alpha:]])(trust|trusted|admit|admitted)([^[:alpha:]]|$)' "$proof"; then status=TRUST_STEP
              elif ! tail -n1 "$proof" | grep -Eq '^\(step [^ ]+ false :rule '; then status=NO_FALSE_GOAL
              else
                set +e; (cd out && timeout 300 "$ETHOS" "${proof#out/}" > "${log#out/}" 2>&1); erc=$?; set -e
                if [[ $erc -ne 0 ]] || ! grep -qx 'correct' "$log"; then status="ETHOS_REJECT_$erc"
                else
                  python3 - "$proof" "$altered" <<'PY'
          from pathlib import Path
          import sys
          src,dst=map(Path,sys.argv[1:3]); lines=src.read_text().splitlines()
          for i in range(len(lines)-1,-1,-1):
              if lines[i].startswith('(step ') and ' false :rule ' in lines[i]:
                  lines[i]=lines[i].replace(' false :rule ',' true :rule ',1); break
          else: raise SystemExit('no terminal false step')
          dst.write_text('\n'.join(lines)+'\n')
          PY
                  set +e; (cd out && timeout 120 "$ETHOS" "${altered#out/}" > "${alog#out/}" 2>&1); arc=$?; set -e
                  if [[ $arc -eq 0 ]] && grep -qx 'correct' "$alog"; then status=ALTERED_CERT_ACCEPTED; else status=UNSAT_CERTIFIED_CPC; fi
                fi
              fi
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$lane" "$label" "$family" "$qsha" "$status" >> out/METAMORPHIC_CERTIFICATES.tsv
            count=$((count+1)); [[ $status == UNSAT_CERTIFIED_CPC ]] || bad=$((bad+1))
          }
          for q in out/queries/preserving/*/*.smt2; do certify semantic_equivalence "$q"; done
          for q in out/queries/undef_irrelevance/*/*.smt2; do certify tnf_undef_irrelevance "$q"; done
          for q in out/queries/correspondence/*/*.smt2; do certify yosys_tnf_correspondence "$q"; done
          echo "count=$count" >> "$GITHUB_OUTPUT"; echo "uncertified=$bad" >> "$GITHUB_OUTPUT"
          cat out/METAMORPHIC_CERTIFICATES.tsv

      - name: Pair-level frozen relation invariance diagnostics
        run: |
          set -euo pipefail
          PYTHONPATH=smoke python3 - <<'PY'
          import json
          from pathlib import Path
          from tnf_scope import analyze

          pairs=[('natural','natural_old','natural_new','INCOMPARABLE'),('mirror','mirror_old','mirror_new','CONTRACT')]
          families=[p.stem for p in sorted((Path('out/meta')/'natural_old').glob('*.json')) if p.name!='manifest.json']
          rows=[]; bad=[]
          def compact(r): return {'relation':r['relation'],'old_only_sat':r['old_only_sat'],'new_only_sat':r['new_only_sat']}
          for pair,old_label,new_label,expected in pairs:
              bo=Path('out/base')/(old_label+'.json'); bn=Path('out/base')/(new_label+'.json')
              baseline=compact(analyze(str(bo),str(bn)))
              if baseline['relation']!=expected: raise SystemExit(f'{pair}: frozen baseline drifted: {baseline}')
              for fam in families:
                  to=Path('out/meta')/old_label/(fam+'.json'); tn=Path('out/meta')/new_label/(fam+'.json')
                  for side in ('old','new','both'):
                      o=to if side in ('old','both') else bo
                      n=tn if side in ('new','both') else bn
                      observed=compact(analyze(str(o),str(n)))
                      passed=observed==baseline
                      row={'pair':pair,'family':fam,'side':side,'baseline':baseline,'observed':observed,'pass':passed}
                      rows.append(row)
                      if not passed: bad.append(row)
          out=Path('out/PAIR_RELATION_INVARIANCE.json')
          out.write_text(json.dumps({'schema':'g3-pair-relation-invariance-v1','count':len(rows),'failures':len(bad),'rows':rows},indent=2,sort_keys=True)+'\n')
          if len(rows)!=60 or bad: raise SystemExit(f'pair relation invariance failed: count={len(rows)} failures={len(bad)}')
          print('PAIR_RELATION_INVARIANCE_PASS count=60')
          PY

      - name: Seal evidence
        if: always()
        run: |
          set -euo pipefail
          git rev-parse HEAD > out/runner.commit.txt
          sha256sum .github/workflows/g3-metamorphic-cert.yml smoke/g3_preserving_inputs.py smoke/g3_emit_semantic_xor.py smoke/g3_emit_aggregate_correspondence_v4.py smoke/tnf_scope.py smoke/validate_tnf_smt2.py > out/runner-sources.sha256
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/ALL_SHA256SUMS.txt || true

      - name: Upload metamorphic certificate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-metamorphic-cert-evidence
          path: out/

      - name: Enforce complete preserving coverage
        if: always()
        run: |
          test "${{ steps.cert.outputs.count }}" = "120"
          test "${{ steps.cert.outputs.uncertified }}" = "0"
          test "$(python3 -c 'import json;print(json.load(open("out/PAIR_RELATION_INVARIANCE.json"))["count"])' 2>/dev/null || true)" = "60"
          test "$(python3 -c 'import json;print(json.load(open("out/PAIR_RELATION_INVARIANCE.json"))["failures"])' 2>/dev/null || true)" = "0"
