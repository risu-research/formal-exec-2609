name: j-6d4f-wf318
on:
  push:
    branches: ["exec/j-6d4f"]
    paths: ["jobs/j-6d4f/start-wf318"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          git -C "$RUNNER_TEMP/src" init -q wf
          git -C "$RUNNER_TEMP/src/wf" remote add origin https://github.com/wfcommons/WfInstances.git
          git -C "$RUNNER_TEMP/src/wf" fetch -q --depth 1 origin 44236594dc5e5448d8f6d584b7f598626641d46c
          git -C "$RUNNER_TEMP/src/wf" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/src/wf" rev-parse HEAD)" = "44236594dc5e5448d8f6d584b7f598626641d46c"
      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runs/j-6d4f/wf318
          mkdir -p runs/j-6d4f/wf318
          python -m py_compile jobs/j-6d4f/wf318.py
          python jobs/j-6d4f/wf318.py "$RUNNER_TEMP/src/wf" runs/j-6d4f/wf318 | tee runs/j-6d4f/wf318/stdout.txt
          echo 'WF_COMMIT 44236594dc5e5448d8f6d584b7f598626641d46c' > runs/j-6d4f/wf318/source_manifest.txt
          sha256sum runs/j-6d4f/wf318/summary.json runs/j-6d4f/wf318/instances.csv > runs/j-6d4f/wf318/result_manifest.txt
      - name: Seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/j-6d4f/wf318
          git commit -m 'Seal j-6d4f-wf318 output' || true
          git push origin HEAD:exec/j-6d4f
