name: rpki-delta-policy-v1
on:
  workflow_dispatch:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - rpki_delta_policy_v1.py
      - results/rpki_lifecycle_panel_v1_20261002/**
      - .github/workflows/rpki-delta-policy-v1.yml
permissions:
  contents: write
jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - run: python3 rpki_delta_policy_v1.py
      - name: Commit policy frontier if present
        run: |
          if [ ! -f results/rpki_delta_policy_v1_20261002/policy_frontier.json ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpki_delta_policy_v1_20261002
          git commit -m "add RPKI lifecycle policy frontier [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpki-delta-policy-v1-20261002
          path: results/rpki_delta_policy_v1_20261002
          if-no-files-found: ignore
