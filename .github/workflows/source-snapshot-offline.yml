name: source-snapshot-for-offline-audit
on:
  push:
    branches: [ci71-paired-compaction]
    paths: [.github/workflows/source-snapshot-offline.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Copy pinned executable source modules
        run: |
          set -euo pipefail
          mkdir -p export
          cp experiments/db_c69_mixed_age.py experiments/db_c69_geometry.py experiments/db_c71_paired.py experiments/db_c68_http_client.py experiments/db_c42.py experiments/db_mixed_history_upgrade.py experiments/db_inplace_upgrade_replay.py experiments/db_sf1_probe.py export/
          git fetch -q --no-tags origin a5783ac9d5ed40859fb3a7a4c2c32f354e0c9ac7
          git show a5783ac9d5ed40859fb3a7a4c2c32f354e0c9ac7:experiments/db_c70_matched.py > export/db_c70_matched.py
          python3 -m compileall -q export/
          python3 - <<'PY'
          import hashlib,pathlib,json
          root=pathlib.Path('export')
          (root/'source_hashes.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('*.py')},indent=2,sort_keys=True)+'\\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-code-snapshot
          retention-days: 3
          path: export/
