name: rpki-lifecycle-refine-v2
on:
  workflow_dispatch:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - rpki_lifecycle_refine_v2.py
      - results/rpki_lifecycle_panel_v1_20261002/**
      - .github/workflows/rpki-lifecycle-refine-v2.yml
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - run: python3 rpki_lifecycle_refine_v2.py
      - name: Commit refined lifecycle if present
        run: |
          if [ ! -f results/rpki_lifecycle_refine_v2_20261002/summary.json ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpki_lifecycle_refine_v2_20261002
          git commit -m "add exact-date RPKI lifecycle refinement [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpki-lifecycle-refine-v2-20261002
          path: results/rpki_lifecycle_refine_v2_20261002
          if-no-files-found: ignore
