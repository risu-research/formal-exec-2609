name: rpki-inversion-spool-probe
on:
  push:
    branches: [rpki-pilot-20261002]
    paths: ['runs/TRIGGER_RPKI_INVERSION_SPOOL_PROBE.txt']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python rpki_inversion_spool_probe.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/rpki_inversion_spool_probe_20261002
          git diff --cached --quiet || git commit -m 'add independent RPKI spool probe [skip ci]'
          git pull --rebase origin rpki-pilot-20261002
          git push origin HEAD:rpki-pilot-20261002
