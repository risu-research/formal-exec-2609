name: tabrepo-replication-260930

on:
  push:
    branches: [run/tabrepo-replication-260930-work]
    paths:
      - '.github/workflows/tabrepo-replication-260930.yml'
      - 'runs/tabrepo-replication-260930/replicate.py'
      - 'runs/tabrepo-replication-260930/FUNCTIONAL_COMPARABILITY_AMENDMENT.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tabrepo-replication-260930
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/tabrepo-replication-260930-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned analysis stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 pyarrow==18.1.0 tabulate==0.9.0
      - name: Verify immutable preregistration and matrix freeze
        shell: bash
        run: |
          set -euo pipefail
          test -f runs/tabrepo-replication-260930/PREREGISTRATION.md
          test -f runs/tabrepo-replication-260930/FUNCTIONAL_COMPARABILITY_AMENDMENT.md
          test -f results/tabrepo-matrix-freeze-260930/MATRIX_FREEZE.json
          test -f results/tabrepo-matrix-freeze-260930/task_frame.csv
          python - <<'PY'
          import json
          f=json.load(open('results/tabrepo-matrix-freeze-260930/MATRIX_FREEZE.json'))
          assert f['no_outcome_values_read'] is True
          assert f['source_parquet_sha256']=='6d815d406e0a69d0c1ec1910ac1a9c5b0142ef821bb4a9a544244e006350836f'
          assert f['source_metadata_sha256']=='d4d822be62c9fefc63bbe8461132298d0be981cb64683d862f66ecc5542bd40c'
          assert f['primary_raw_metric']=='roc_auc'
          print('freeze verified:',len(f['classification_task_ids']),len(f['raw_task_ids']),len(f['classification_frameworks']),len(f['raw_frameworks']))
          PY
      - name: Fetch and hash exact public result matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/tabrepo results/tabrepo-replication-260930/provenance
          curl -fL --retry 3 -o tmp/tabrepo/configs.parquet https://tabrepo.s3.us-west-2.amazonaws.com/contexts/2023_11_14/configs.parquet
          test "$(sha256sum tmp/tabrepo/configs.parquet | awk '{print $1}')" = "6d815d406e0a69d0c1ec1910ac1a9c5b0142ef821bb4a9a544244e006350836f"
          sha256sum tmp/tabrepo/configs.parquet > results/tabrepo-replication-260930/provenance/source_parquet_sha256.txt
          cp results/tabrepo-matrix-freeze-260930/MATRIX_FREEZE.json results/tabrepo-replication-260930/MATRIX_FREEZE.json
          cp results/tabrepo-matrix-freeze-260930/task_frame.csv results/tabrepo-replication-260930/task_frame.csv
          cp runs/tabrepo-replication-260930/PREREGISTRATION.md results/tabrepo-replication-260930/PREREGISTRATION.md
          cp runs/tabrepo-replication-260930/FUNCTIONAL_COMPARABILITY_AMENDMENT.md results/tabrepo-replication-260930/FUNCTIONAL_COMPARABILITY_AMENDMENT.md
      - name: Run preregistered replication
        shell: bash
        run: |
          set -euo pipefail
          python runs/tabrepo-replication-260930/replicate.py \
            --parquet tmp/tabrepo/configs.parquet \
            --freeze results/tabrepo-matrix-freeze-260930/MATRIX_FREEZE.json \
            --task-frame results/tabrepo-matrix-freeze-260930/task_frame.csv \
            --out results/tabrepo-replication-260930/analysis \
            --perm 20000
      - name: Freeze execution provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "python=$(python --version 2>&1)"
            python - <<'PY'
          import numpy,pandas,scipy,pyarrow
          print('numpy='+numpy.__version__)
          print('pandas='+pandas.__version__)
          print('scipy='+scipy.__version__)
          print('pyarrow='+pyarrow.__version__)
          PY
          } > results/tabrepo-replication-260930/provenance/environment.txt
          find results/tabrepo-replication-260930 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > results/tabrepo-replication-260930/SHA256SUMS.txt
      - name: Commit compact replication results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/tabrepo-replication-260930
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze independent TabRepo replication results [skip ci]'
            git push origin HEAD:run/tabrepo-replication-260930-work
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tabrepo-replication-260930
          path: results/tabrepo-replication-260930/
          if-no-files-found: error
          retention-days: 90
