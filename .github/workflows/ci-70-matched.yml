name: ci-70-matched-parts
on:
  push:
    branches: [ci70-part-normalization]
    paths: [experiments/db_c70_matched.py, .github/workflows/ci-69-geometry.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  batched-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        group: [a, b, c]
    env:
      C70_RESTART: "0"
      C68_RESTART: "0"
      C68_REPS: "4"
      RUN_GROUP: ${{ matrix.group }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check source and record hashes
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/db_c70_matched.py experiments/db_c68_http_client.py experiments/db_c42.py experiments/db_mixed_history_upgrade.py
          sha256sum experiments/db_c70_matched.py experiments/db_c68_http_client.py experiments/db_c42.py > SOURCE_SHA256.txt
      - name: Execute one-part-per-month geometry control
        run: |
          set -o pipefail
          python3 experiments/db_c70_matched.py 2>&1 | tee progress.log
      - name: Archive raw evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c70-${{ matrix.group }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            SOURCE_SHA256.txt
            progress.log
            c70matched/PRESPECIFICATION.json
            c70matched/SOURCE_IDENTITY.json
            c70matched/month_plan.json
            c70matched/decision_matrix.csv
            c70matched/FINAL_STATUS.json
            c70matched/before_version_restart/
            c70matched/old_sham_before/
            c70matched/old_sham/
            c70matched/old_sham_after/
            c70matched/target_before_rebuild/
            c70matched/target_before_measure/
            c70matched/target/
            c70matched/target_after_measure/
