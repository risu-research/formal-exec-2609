name: ci-56
on:
  push:
    branches: [ci48-neutral-run]
    paths: [.github/workflows/ci-56.yml, experiments/db_c56.py]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  balanced-startup-short-block:
    name: Nine-reset block ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rep: [0, 1]
    env:
      C56_REPLICATE: ${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v4
      - name: Source and balanced Latin square verification
        run: |
          set -euo pipefail
          mkdir -p audit56
          sha256sum experiments/db_c42.py experiments/db_c50.py experiments/db_c52.py experiments/db_c53.py experiments/db_c54.py experiments/db_c56.py > audit56/SOURCE_SHA256.txt
          python3 -m py_compile experiments/db_c56.py
          if grep -iE '(moon.?hwan|northwestern|@hotmail|@risuinstitute|password=|bearer [a-z0-9_-]+)' experiments/db_c56.py; then exit 1; fi
          python3 experiments/db_c56.py --preflight
      - name: Execute balanced cold-start block with frozen parts
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_c56.py 2>&1 | tee audit56/progress.log
      - name: Preserve source receipts and invariant checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c56-block-${{ matrix.rep }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            audit56/
            s56_rep${{ matrix.rep }}/PREREGISTERED.json
            s56_rep${{ matrix.rep }}/SOURCE_IDENTITY.json
            s56_rep${{ matrix.rep }}/FINAL_STATUS.json
            s56_rep${{ matrix.rep }}/post_ingest/state.json
            s56_rep${{ matrix.rep }}/post_ingest/order_schedule.json
            s56_rep${{ matrix.rep }}/post_ingest/physical_baseline.json
            s56_rep${{ matrix.rep }}/post_ingest/profile_summary.json
            s56_rep${{ matrix.rep }}/post_ingest/decisions.json
            s56_rep${{ matrix.rep }}/post_ingest/startup_policy_contrasts.json
            s56_rep${{ matrix.rep }}/post_ingest/validation.json
            s56_rep${{ matrix.rep }}/post_ingest/receipts.csv
            s56_rep${{ matrix.rep }}/later/state.json
            s56_rep${{ matrix.rep }}/later/validation.json
            s56_rep${{ matrix.rep }}/post_ingest/reset_changed_*.json
