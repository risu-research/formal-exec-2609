name: ci-43-cache
on:
  push:
    branches: [stage39-independent-replication]
    paths: [.github/workflows/ci-43-cache.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          python3 -m py_compile experiments/db_c43_cache.py
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
      - name: Execute cache-only comparison
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_c43_cache.py 2>&1 | tee c43-cache.log
      - name: Preserve receipts even if failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c43-cache
          retention-days: 14
          if-no-files-found: warn
          path: |
            c43-cache.log
            c43c/SOURCE_IDENTITY.json
            c43c/answers.json
            c43c/FINAL_STATUS.json
            c43c/initial/physical.json
            c43c/restart_ab/physical.json
            c43c/restart_ba/physical.json
            c43c/after_ab/physical.json
            c43c/after_ba/physical.json
            c43c/first_ab.csv
            c43c/first_ba.csv
            c43c/warm_ab.csv
            c43c/warm_ba.csv
            c43c/*_aggregate.json
