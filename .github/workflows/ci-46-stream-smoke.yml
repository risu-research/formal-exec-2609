name: ci-46-stream-smoke
on:
  push:
    branches: [stage39-independent-replication]
    paths: [.github/workflows/ci-46-stream-smoke.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Test ClickHouse 26.8 multiplex replay logging
        run: |
          set -euo pipefail
          docker run -d --name c46_smoke --ulimit nofile=262144:262144 clickhouse/clickhouse-server:26.8.1.2041
          for i in $(seq 1 60); do
            if docker exec c46_smoke clickhouse-client --query "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          cat >/tmp/batch.sql <<'SQL'
          SELECT count() FROM numbers(3) SETTINGS use_statistics=0,use_statistics_for_part_pruning=1,use_statistics_cache=0,max_threads=2,log_comment='C46_SMOKE_1';
          SELECT count() FROM numbers(4) SETTINGS use_statistics=1,use_statistics_for_part_pruning=1,use_statistics_cache=0,max_threads=2,log_comment='C46_SMOKE_2';
          SQL
          cat /tmp/batch.sql | docker exec -i c46_smoke clickhouse-client --multiquery --format Null
          docker exec c46_smoke clickhouse-client --query "SYSTEM FLUSH LOGS"
          cnt=$(docker exec c46_smoke clickhouse-client --query "SELECT count() FROM system.query_log WHERE type='QueryFinish' AND startsWith(log_comment,'C46_SMOKE_') FORMAT TSV")
          echo "C46_BATCH_LOGGED=$cnt"
          test "$cnt" -eq 2
