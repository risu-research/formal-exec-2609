name: ci-45
on:
  push:
    branches: [stage39-independent-replication]
    paths: [.github/workflows/ci-45.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  co-located:
    name: paired-${{ matrix.cap }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cap: [300000, 1500000]
    steps:
      - uses: actions/checkout@v4
      - name: Identify execution environment
        env:
          CAP: ${{ matrix.cap }}
        run: |
          set -euo pipefail
          mkdir -p audit45
          {
            echo "cap=$CAP"
            echo "sha=$GITHUB_SHA"
            date -u '+utc=%FT%TZ'
            uname -a
            lscpu | grep -E '(Model name|CPU\(s\))' || true
            nproc
            free -h
            df -h .
            sha256sum experiments/db_c45.py experiments/db_mixed_history_upgrade.py experiments/db_tpch_join_boundary.py
          } > audit45/host.txt
          python3 -m py_compile experiments/db_c45.py
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
      - name: Run joint calibration
        env:
          C45_CAP: ${{ matrix.cap }}
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python3 experiments/db_c45.py 2>&1 | tee audit45/trace.log
      - name: Preserve pre-registered comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c45-${{ matrix.cap }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            audit45/
            c45_${{ matrix.cap }}/SOURCE_IDENTITY.json
            c45_${{ matrix.cap }}/ingest.json
            c45_${{ matrix.cap }}/acquisition.json
            c45_${{ matrix.cap }}/fixed_ssb/physical.json
            c45_${{ matrix.cap }}/verified_ssb/physical.json
            c45_${{ matrix.cap }}/fixed_join.json
            c45_${{ matrix.cap }}/verified_join.json
            c45_${{ matrix.cap }}/answers.json
            c45_${{ matrix.cap }}/plans.json
            c45_${{ matrix.cap }}/receipts.csv
            c45_${{ matrix.cap }}/medians.json
            c45_${{ matrix.cap }}/mixture_summary.json
            c45_${{ matrix.cap }}/FINAL_STATUS.json
            c45_${{ matrix.cap }}/upstream_tpch_*.sql
            c45_${{ matrix.cap }}/upstream_schema.sql

# re-execute after randomized-arm container correction
