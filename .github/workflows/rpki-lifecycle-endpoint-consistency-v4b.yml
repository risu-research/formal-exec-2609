name: rpki-lifecycle-endpoint-consistency-v4b
on:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - .github/workflows/rpki-lifecycle-endpoint-consistency-v4b.yml
      - rpki_lifecycle_endpoint_consistency_v4b.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Run endpoint consistency and targeted RIPE archive audit
        run: python3 rpki_lifecycle_endpoint_consistency_v4b.py
      - name: Show summary
        run: cat results/rpki_lifecycle_endpoint_consistency_v4b_20261002/summary.json
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpki_lifecycle_endpoint_consistency_v4b_20261002
          git commit -m "add lifecycle endpoint consistency audit [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpki-lifecycle-endpoint-consistency-v4b-20261002
          path: results/rpki_lifecycle_endpoint_consistency_v4b_20261002
          if-no-files-found: ignore
